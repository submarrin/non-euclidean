<p class="eyebrow">Chapter 2</p>
<h2 class="ch-title">A History of Non-Euclidean Geometry: From Antiquity to Poincaré</h2>

<div class="draft-banner progress"><strong>In progress</strong><span>In review and being updated.</span></div>

<p>The development of non-Euclidean geometry is one of the most instructive episodes in the history of mathematics: a two-thousand-year effort to <em>prove</em> a postulate culminated, paradoxically, in the proof of its <em>independence</em>. This effort also led to the discovery that the alternatives yield equally consistent geometries. This chapter traces that development, drawing on Greenberg’s history of the parallel postulate <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93]</a>, the Russian historical synthesis of Laptev and Rozenfeld <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81]</a>, and the modern treatments of Galperin <a class="cite" href="#bib-Gal20" title="Grigory A. Galperin. “Teoremy Lezhandra o summe uglov treugol&#x27;nika v absoliutnoi i giperbolicheskoi geometriiakh [Legendre&#x27;s Theorems on the Sum of the Angles of a Triangle in Abso">[Gal20]</a> and Sosinsky <a class="cite" href="#bib-Sos20" title="Alexei B. Sosinsky. “Ob ekvivalentnosti trekh modelei ploskosti Lobachevskogo [On the Equivalence of Three Models of the Lobachevsky Plane]”. In: Matematicheskoe prosveshchenie, 3r">[Sos20]</a>.</p>

<p class="draftnote"><em>Note on this draft.</em> This is the third iteration of the chapter. It contains only material checked page by page against the sources already in hand. More will be added once Bonola (1912), Cogliati (2012) and Trudeau (2001) have been studied: the Schweikart–Taurinus episode, Poincaré’s route to his models via Fuchsian functions, and the closing philosophical discussion of the chapter.</p>

<h2 class="sec" id="s2-1" data-key="sec:euclid_parallel"><span class="no">2.1</span>Euclid and the Parallel Postulate</h2>

<p>Euclid’s <i>Elements</i> (c. 300 BCE) organises plane geometry around five postulates. In the standard translation of Heath <a class="cite" href="#bib-Euc56" title="Euclid. The Thirteen Books of the Elements. Trans. by Thomas L. Heath. 3 vols., 2nd ed.; with introduction and commentary by the translator. Online edition: Perseus Digital Library">[Euc56,&nbsp;Book I,&nbsp;Postulates]</a>, they read:</p>

<ol class="axioms">
  <li><span class="lab">(E1)</span><span>To draw a straight line from any point to any point.</span></li>
  <li><span class="lab">(E2)</span><span>To produce a finite straight line continuously in a straight line.</span></li>
  <li><span class="lab">(E3)</span><span>To describe a circle with any centre and distance.</span></li>
  <li><span class="lab">(E4)</span><span>That all right angles are equal to one another.</span></li>
  <li id="E5"><span class="lab">(E5)</span><span><b>(The Parallel Postulate.)</b> That, if a straight line falling on two straight lines make the interior angles on the same side less than two right angles, the two straight lines, if produced indefinitely, meet on that side on which are the angles less than the two right angles.</span></li>
</ol>

<p>The fifth postulate <a class="xref" href="#E5">(E5)</a> is conspicuously longer and structurally different from the first four. Euclid himself appears not to have quite trusted it: he postponed using it in a proof for as long as possible, until his 29th proposition <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 148]</a>. The theorems that can be proved without it form what is now called <em>neutral</em> (or <em>absolute</em>) geometry: the body of results common to Euclidean and hyperbolic geometry <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 116]</a>.</p>

<aside class="hnote" id="hn-playfair">
  <p class="hn-title">Historical Note 2.1 <em>Playfair’s Equivalent Formulation</em></p>
  <p>The most convenient modern form of <a class="xref" href="#E5">(E5)</a> is <em>Playfair’s axiom</em> (in Hilbert’s system, the <em>parallel postulate</em>): <i>through a given point not on a given line, there exists exactly one line parallel to the given line.</i> In neutral geometry it is logically equivalent to <a class="xref" href="#E5">(E5)</a> <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;Thm. 4.5,&nbsp;pp. 128–129]</a>. Its clarity makes it the standard starting point for all three trajectories.</p>
</aside>

<h2 class="sec" id="s2-2" data-key="sec:attempted_proofs"><span class="no">2.2</span>Two Thousand Years of Attempted Proofs</h2>

<p>For over two thousand years some of the best mathematicians tried to derive the parallel postulate from the other axioms <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 149]</a>. Every attempt failed, and usually in an instructive way: once the flawed step is located, it turns out to be another statement equivalent to the parallel postulate <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;pp. 148–149]</a>. By 1763 G. S. Klügel could write a doctoral thesis locating the flaws in 28 different supposed proofs, and d’Alembert called the situation “the scandal of geometry” <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 161]</a>.</p>

<h3 id="s2-2-1" data-key="Proclus and the Islamic Tradition"><span class="no">2.2.1</span>Proclus and the Islamic Tradition</h3>

<p>Proclus (410–485 CE) held that the postulate “ought even to be struck out of the Postulates altogether; for it is a theorem involving many difficulties,” and attempted a proof of his own <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 149]</a>. His argument is sophisticated, but its final step tacitly treats two parallel lines as staying a constant distance apart — something that cannot be proved in neutral geometry without the parallel postulate itself, so the argument is circular <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;pp. 150–151]</a>.</p>

<p>Mathematicians of the Islamic world worked on the same problem. The quadrilaterals now named after Saccheri were studied centuries earlier by Omar Khayyam and Nasir Eddin al-Tusi, and those now named after Lambert by Ibn al-Haytham <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;pp. 155,&nbsp;160]</a>; al-Tusi’s own attempted proof rested on several unjustified assumptions <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;pp. 151–152]</a>.</p>

<h3 id="s2-2-2" data-key="subsec:saccheri"><span class="no">2.2.2</span>Saccheri’s Quadrilateral (1733)</h3>

<p>The Jesuit priest and logician Girolamo Saccheri (1667–1733) published, just before his death, <i>Euclides ab omni naevo vindicatus</i> (“Euclid Freed of Every Flaw”); the book went largely unnoticed until Beltrami rediscovered it a century and a half later <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 154]</a>. Saccheri argued by <em>reductio ad absurdum</em>: he assumed the negation of the parallel postulate and tried to deduce a contradiction. His tool was the quadrilateral $ABCD$ with right angles at $A$ and $B$ and equal legs $AD = BC$ (<a class="xref" href="#fig-2-1">Figure 2.1</a>), now called the <em>Saccheri quadrilateral</em> <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;pp. 154–155]</a>.</p>

<figure id="fig-2-1">
  <div class="fig-wrap" data-fig="fig:saccheri_quad"></div>
  <figcaption><b>Figure 2.1</b> Schematic drawings of Saccheri’s three hypotheses for a quadrilateral $ABCD$ with right angles at $A$ and $B$ and equal legs $AD = BC$. A Euclidean drawing cannot show a non-Euclidean quadrilateral faithfully, so the summit $DC$ is drawn as a curve in order to display summit angles that are right, obtuse, or acute. In neutral geometry the two summit angles are always congruent; the obtuse case (H2) is ruled out there, and the acute case (H3) is the one realised in hyperbolic geometry <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 155]</a>.</figcaption>
</figure>

<p>It is easy to prove in neutral geometry that the summit angles $\angle C$ and $\angle D$ are congruent, which leaves three cases <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 155]</a>:</p>

<ol class="hyp">
  <li id="HRA"><span class="lab">(H1)</span><span><b>Hypothesis of the Right Angle:</b> the summit angles are right angles, so $ABCD$ is a rectangle. This is the Euclidean case: the existence of a rectangle is equivalent in neutral geometry to the parallel postulate <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;pp. 156–157]</a>.</span></li>
  <li id="HOA"><span class="lab">(H2)</span><span><b>Hypothesis of the Obtuse Angle:</b> the summit angles are obtuse. Saccheri succeeded in showing that this case leads to a contradiction — in modern terms, the angle sum of the quadrilateral would exceed $360^\circ$, contradicting a corollary of the Saccheri–Legendre theorem (proved in <a class="xref" href="#ch3">Chapter 3</a>) <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 155]</a>.</span></li>
  <li id="HAA"><span class="lab">(H3)</span><span><b>Hypothesis of the Acute Angle:</b> the summit angles are acute. However hard he tried, Saccheri could not squeeze a contradiction out of this case. He deduced many strange results and finally declared that “the hypothesis of the acute angle is absolutely false, because [it is] repugnant to the nature of the straight line!” <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 155]</a></span></li>
</ol>

<p>As Greenberg puts it, although he did not recognise it, Saccheri had discovered non-Euclidean geometry <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 155]</a>.</p>

<h3 id="s2-2-3" data-key="subsec:lambert"><span class="no">2.2.3</span>Lambert’s Quadrilateral and the “Imaginary Sphere”</h3>

<p>Johann Heinrich Lambert (1728–1777) studied quadrilaterals with three right angles, now named after him. Like Saccheri, he disproved the obtuse-angle hypothesis and studied the consequences of the acute one: he observed that it forces similar triangles to be congruent, and hence implies an absolute unit of length, and he noticed that the defect of a triangle is proportional to its area <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 160]</a>. On a sphere of radius $r$ the <em>excess</em> of a triangle’s angle sum over $180^\circ$ is proportional to its area with constant $r^2$; replacing $r$ by $ir$ turns the excess into a defect. Lambert therefore speculated that the acute-angle hypothesis describes geometry on a “sphere of imaginary radius” <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 160]</a> — an idea that returns in Cayley’s projective metric (<a class="xref" href="#s2-4-2">Section 2.4.2</a>). Lambert did not submit his <i>Theory of Parallels</i> for publication; it appeared posthumously in 1786 <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 161]</a>.</p>

<h3 id="s2-2-4" data-key="subsec:legendre"><span class="no">2.2.4</span>Legendre’s Attempts (1794–1833)</h3>

<p>Adrien-Marie Legendre (1752–1833) returned to the parallel postulate in edition after edition of his influential textbook <i>Éléments de géométrie</i>, offering a new “proof” each time. In the fourteenth and last edition he admitted that the only thing he had managed to prove about the angles of a triangle is that their sum does not exceed $180^\circ$ <a class="cite" href="#bib-Gal20" title="Grigory A. Galperin. “Teoremy Lezhandra o summe uglov treugol&#x27;nika v absoliutnoi i giperbolicheskoi geometriiakh [Legendre&#x27;s Theorems on the Sum of the Angles of a Triangle in Abso">[Gal20,&nbsp;pp. 22,&nbsp;25–26]</a>. Legendre did not know of Saccheri’s work and <em>rediscovered</em> Saccheri’s two main theorems of neutral geometry <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 157]</a>; Galperin notes that Saccheri had anticipated him in both <a class="cite" href="#bib-Gal20" title="Grigory A. Galperin. “Teoremy Lezhandra o summe uglov treugol&#x27;nika v absoliutnoi i giperbolicheskoi geometriiakh [Legendre&#x27;s Theorems on the Sum of the Angles of a Triangle in Abso">[Gal20,&nbsp;p. 36]</a>.</p>

<p>The first of these is the angle-sum inequality, today called the <em>Saccheri–Legendre theorem</em> (proved in <a class="xref" href="#ch3">Chapter 3</a>) — a name that appeared only in the twentieth century <a class="cite" href="#bib-Gal20" title="Grigory A. Galperin. “Teoremy Lezhandra o summe uglov treugol&#x27;nika v absoliutnoi i giperbolicheskoi geometriiakh [Legendre&#x27;s Theorems on the Sum of the Angles of a Triangle in Abso">[Gal20,&nbsp;p. 36]</a>. Legendre’s proof rests on the <em>siphon construction</em>: given $\triangle ABC$, let $M$ be the midpoint of $BC$ and extend the median $AM$ to $A'$ with $MA' = MA$. Then $\triangle ABM \cong \triangle A'CM$ (SAS), so the new triangle $AA'C$ has the same angle sum, and when $A$ is the smallest angle, its largest angle is the sum of the two largest angles of $\triangle ABC$ while its smallest angle is at most half of the old smallest one. Iterating drives the two smallest angles toward zero; if the angle sum exceeded $180^\circ$, the largest angle would eventually exceed $180^\circ$ on its own, which is impossible <a class="cite" href="#bib-Gal20" title="Grigory A. Galperin. “Teoremy Lezhandra o summe uglov treugol&#x27;nika v absoliutnoi i giperbolicheskoi geometriiakh [Legendre&#x27;s Theorems on the Sum of the Angles of a Triangle in Abso">[Gal20,&nbsp;pp. 26–29,&nbsp;36]</a>. The second theorem states that if a single triangle has angle sum $180^\circ$, then every triangle does <a class="cite" href="#bib-Gal20" title="Grigory A. Galperin. “Teoremy Lezhandra o summe uglov treugol&#x27;nika v absoliutnoi i giperbolicheskoi geometriiakh [Legendre&#x27;s Theorems on the Sum of the Angles of a Triangle in Abso">[Gal20,&nbsp;p. 36]</a>, <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;Thm. 4.7,&nbsp;pp. 131–134]</a>. Legendre’s proofs were elegant enough that Lobachevsky later used them in his own work <a class="cite" href="#bib-Gal20" title="Grigory A. Galperin. “Teoremy Lezhandra o summe uglov treugol&#x27;nika v absoliutnoi i giperbolicheskoi geometriiakh [Legendre&#x27;s Theorems on the Sum of the Angles of a Triangle in Abso">[Gal20,&nbsp;p. 36]</a>.</p>

<p>Legendre’s attempts to prove that the angle sum is <em>exactly</em> $180^\circ$ all failed. In one of them, every step can be justified except a single unproved assumption: that through any point in the interior of an acute angle there passes a line meeting both sides of the angle. That assumption is itself equivalent to the parallel postulate — the same hidden error made centuries earlier by Simplicius, al-Jawhari and al-Tusi <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;pp. 157–159]</a>. Legendre published a collection of his many attempts as late as 1833, the year he died <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 157]</a>.</p>

<h2 class="sec" id="s2-3" data-key="sec:19c_discovery"><span class="no">2.3</span>The Nineteenth-Century Discovery</h2>

<p>Three mathematicians, working independently with different emphases, arrived at a non-Euclidean geometry in the first third of the nineteenth century.</p>

<h3 id="s2-3-1" data-key="subsec:gauss"><span class="no">2.3.1</span>Carl Friedrich Gauss (1777–1855)</h3>

<p>Gauss reached a clear understanding of non-Euclidean geometry, but he published nothing on the subject and confined himself to brief remarks in letters to a few friends <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 67]</a>. In an 1817 letter to the astronomer Wilhelm Olbers he wrote of being “more and more convinced that the necessity of our geometry cannot be proved.” A year later, writing to Gerling, he welcomed his correspondent’s willingness to doubt Euclidean geometry while warning that “the wasps whose nest you disturb will fly about your head” <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 60]</a>. Laptev and Rozenfeld connect his silence with his move away from the Kantian view that geometric concepts are given a priori; by the “wasps” Gauss apparently meant the defenders of that traditional view <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 60]</a>.</p>

<p>When Bolyai’s work reached him, Gauss called its author, in a letter to Gerling, “a genius of the first magnitude”, yet wrote to Bolyai’s father that he could not praise it, since “to praise it would be to praise myself”: its results coincided almost entirely with his own, some of them “thirty to thirty-five years” old <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 61]</a>.</p>

<h3 id="s2-3-2" data-key="subsec:lobachevsky"><span class="no">2.3.2</span>Nikolai Ivanovich Lobachevsky (1792–1856)</h3>

<p>Lobachevsky, whose whole career was bound up with Kazan University, was the first to <em>publish</em> a systematic non-Euclidean geometry. His memoir <i>On the Foundations of Geometry</i> appeared in the university’s journal, the <i>Kazan Messenger</i>, in 1829–1830 <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;pp. 57–59]</a>. He returned to the subject repeatedly, most influentially in the German treatise <i>Geometrische Untersuchungen zur Theorie der Parallellinien</i> <a class="cite" href="#bib-Lob40" title="Nikolai Ivanovich Lobachevsky. Geometrische Untersuchungen zur Theorie der Parallellinien. English translation by G. B. Halsted reprinted in Bonola, Non-Euclidean Geometry, 1912. B">[Lob40]</a> (1840).</p>

<p>Laptev and Rozenfeld <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 58]</a> emphasise that Lobachevsky’s philosophical foundation was decisively <em>empiricist</em>: he held that geometric concepts are abstracted from physical experience, so the question of which geometry is “true” is empirical rather than a priori. His first published paper begins: “The first concepts, with which any science begins, must be clear and be led to the smallest possible number.” He explicitly rejected the Kantian view that space is an intuition given prior to experience; this philosophical stance gave him the freedom to discard the fifth postulate.</p>

<p>Lobachevsky’s positive contribution was a complete trigonometry for his <em>“imaginary geometry”</em>, in which through every point there pass two lines parallel to a given line and the angle of parallelism is given by $\Pi(a) = 2\arctan e^{-a/q}$ for a constant $q$ <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 62]</a> (proved in <a class="xref" href="#ch3">Chapter 3</a>). In this geometry the area of a triangle equals $q^2\delta$, where $\delta$ is its defect <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 63]</a>.</p>

<h3 id="s2-3-3" data-key="subsec:bolyai"><span class="no">2.3.3</span>János Bolyai (1802–1860)</h3>

<p>János Bolyai, son of the mathematician Farkas Bolyai, graduated from the military engineering academy in Vienna and served as an army officer <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 60]</a>. His father had himself spent years trying to prove the parallel postulate and begged his son to “leave the science of parallels alone” <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;pp. 161–162]</a>. János was not deterred: in 1823 he wrote to his father that “out of nothing I have created a strange new universe” <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 163]</a>. His results appeared in 1832 as an appendix to his father’s textbook; its full title describes it as containing “the absolutely true science of space, independent of the truth or falsity of Euclid’s Axiom XI” <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 61]</a>.</p>

<p>Bolyai’s approach has a distinctive character not shared by Lobachevsky’s: he worked within <em>absolute geometry</em>, establishing results valid in both Euclidean and hyperbolic geometry without committing to either parallel postulate. He called Euclidean geometry “system $\Sigma$” and the new geometry “system $S$,” naming whatever holds in both “absolute” <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;pp. 64–65]</a>. This emphasis on absolute geometry as the common substrate is fundamental to the mathematical background of our module (developed in <a class="xref" href="#ch3">Chapter 3</a>).</p>

<h3 id="s2-3-4" data-key="subsec:riemann"><span class="no">2.3.4</span>Bernhard Riemann and the Geometry of Manifolds (1854)</h3>

<p>In 1854, Bernhard Riemann (1826–1866) delivered his Habilitationsvortrag at Göttingen, <i>Über die Hypothesen, welche der Geometrie zu Grunde liegen</i> (“On the Hypotheses which Lie at the Foundations of Geometry”); it was published posthumously in 1868 <a class="cite" href="#bib-Rie68" title="Bernhard Riemann. “Über die Hypothesen, welche der Geometrie zu Grunde liegen”. In: Abhandlungen der Königlichen Gesellschaft der Wissenschaften zu Göttingen 13 (1868), pp. 133–152">[Rie68]</a>. Riemann introduced the notion of an $n$-dimensional <em>manifold</em> (<i>Mannigfaltigkeit</i>) carrying a metric, an infinitesimal squared distance</p>

<div class="math-display">$$ds^2 = \sum_{i,j=1}^{n} g_{ij}(x)\,dx^i\,dx^j,$$</div>

<p>together with a notion of curvature computable from the metric alone, without reference to any surrounding space. Spaces of constant positive, zero, and negative curvature then correspond to spherical, Euclidean, and Lobachevsky–Bolyai geometry, so that the new geometry takes its place inside a single general framework (the mathematics is developed in <a class="xref" href="#ch3">Chapter 3</a>).</p>

<h3 id="s2-3-5" data-key="subsec:reception"><span class="no">2.3.5</span>Reception and Recognition (1860–1870)</h3>

<p>The new geometry won no recognition in its creators’ lifetimes: apart from a single speech at Kazan, Laptev and Rozenfeld know of no official positive response to Lobachevsky, and none at all to Bolyai’s appendix <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 67]</a>. The situation changed only in the 1860s. In 1860–1865, soon after Gauss’s death, his correspondence with the astronomer H. C. Schumacher (1780–1850) was published, including a letter in which Gauss assessed Lobachevsky’s <i>Geometrische Untersuchungen</i> (our translation from the Russian text of <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 67]</a>):</p>

<blockquote><p>“This work contains the foundations of that geometry which would have to hold, and would form a strictly consistent whole, if Euclidean geometry were not true… Lobachevsky calls it ‘imaginary geometry’; you know that for 54 years now (since 1792) I have shared the same views, with some development of them that I do not wish to mention here; so I found nothing factually new for myself in Lobachevsky’s work. But in developing the subject the author did not follow the path I took myself; it is carried out by Lobachevsky in a masterly fashion, in a truly geometric spirit. I consider myself obliged to draw your attention to this work, which will surely give you quite exceptional pleasure.” <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 67]</a></p></blockquote>

<p>A rapid sequence of publications followed <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 68]</a>:</p>

<ul>
  <li><b>1865.</b> Arthur Cayley published a note comparing Lobachevsky’s trigonometric formulas with those of spherical trigonometry; although he did not grasp the essence of the discovery, the note helped it gain recognition.</li>
  <li><b>1866–1867.</b> Jules Hoüel published a French translation of Lobachevsky’s <i>Geometrische Untersuchungen</i> together with extracts from the Gauss–Schumacher correspondence, followed by his own critical essay on the principles of geometry expounding Lobachevsky’s ideas.</li>
  <li><b>1867–1868.</b> Richard Baltzer presented Lobachevsky’s geometry in the second edition of his <i>Die Elemente der Mathematik</i>; Giuseppe Battaglini published an article on Lobachevsky’s “imaginary geometry” in Naples and, in 1868, an Italian translation of Bolyai’s appendix.</li>
  <li><b>1868.</b> A. V. Letnikov published a Russian translation of the <i>Geometrische Untersuchungen</i>, and Eugenio Beltrami published his interpretations of Lobachevsky’s geometry (see <a class="xref" href="#s2-4-1">Section 2.4.1</a>).</li>
</ul>

<p>As a result, by 1870 Lobachevsky’s geometry was known throughout Europe, and Weierstrass devoted a special seminar to it at the University of Berlin <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 68]</a>. It was in this setting that Felix Klein, who had first heard of Lobachevsky’s geometry from his friend Stolz in the winter of 1869–1870, gave a talk at Weierstrass’s seminar in February 1870 on Cayley’s metric, asking whether Cayley’s and Lobachevsky’s ideas coincide; he was told that the two were far apart, and returned to the question only in the summer of 1871 <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 73]</a> (see <a class="xref" href="#s2-4-3">Section 2.4.3</a>).</p>

<h2 class="sec" id="s2-4" data-key="sec:models_history"><span class="no">2.4</span>Models: Beltrami, Klein, and Poincaré</h2>

<p>The logical consistency of Lobachevsky–Bolyai geometry was not universally accepted until concrete <em>models</em> were constructed: interpretations of its axioms within Euclidean geometry that prove the consistency of the new system relative to the old.</p>

<h3 id="s2-4-1" data-key="subsec:beltrami"><span class="no">2.4.1</span>Beltrami’s Interpretations (1868)</h3>

<p>The first interpretations of the new geometry in Euclidean space were proposed by Eugenio Beltrami (1835–1900) in 1868 <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;pp. 68–69]</a>. One of them represents the hyperbolic plane as the interior of a disk, with Lobachevsky’s “straight lines” represented by chords <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 71]</a> — the model later systematised by Klein and now usually called the <em>Klein model</em>.</p>

<p>Laptev and Rozenfeld give Beltrami’s explicit distance formula: for a point with coordinates $(u,v)$ satisfying $u^2 + v^2 &lt; a^2$, the distance from the origin is</p>

<div class="math-display">$$\rho = \frac{r}{2}\ln
  \frac{a + \sqrt{u^2+v^2}}{a - \sqrt{u^2+v^2}},$$</div>

<p>which is precisely the logarithmic cross-ratio formula of the Klein model <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;eq. (5),&nbsp;p. 71]</a>.</p>

<h3 id="s2-4-2" data-key="subsec:cayley_metric"><span class="no">2.4.2</span>Cayley’s Projective Metric (1859)</h3>

<p>Nearly a decade before Beltrami’s work, Arthur Cayley (1821–1895) laid the algebraic groundwork for the projective interpretation of metric geometries in his <i>Sixth Memoir on Quantics</i> (1859) <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 71]</a>. Cayley’s central idea is to define distance and angle using a fixed conic in the projective plane — the <em>absolute</em>.</p>

<p>For projective coordinates $(x:y:z)$, if the absolute is the imaginary conic $x^2 + y^2 + z^2 = 0$, the distance between points $P = (x:y:z)$ and $P' = (x':y':z')$ is defined as</p>

<div class="math-display">$$\operatorname{Dist}(P, P')
  = \cos^{-1}
    \frac{xx' + yy' + zz'}
         {\sqrt{x^2+y^2+z^2}\;\sqrt{x'^{\,2}+y'^{\,2}+z'^{\,2}}}.$$</div>

<p>When $(x,y,z)$ are the ordinary Cartesian coordinates of a point on the unit sphere ($x^2+y^2+z^2=1$), this reproduces the spherical arc distance formula: the absolute $x^2+y^2+z^2=0$ is an “imaginary sphere,” and the induced geometry is spherical <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;pp. 71–72]</a>.</p>

<p>Cayley further observed that in ordinary Euclidean geometry the absolute degenerates to the <em>circular points at infinity</em>, so Euclidean metric geometry is also a special case of his projective framework <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 72]</a>.</p>

<aside class="hnote" id="hn-cayley_real">
  <p class="hn-title">Historical Note 2.2 <em>Cayley’s Remark on the Real Conic</em></p>
  <p>Laptev and Rozenfeld remark that Cayley “does not study the cases when the conic is real or decomposes into a pair of real pencils, leading to the geometries which are now called hyperbolic (geometry of Lobachevsky) and pseudo-Euclidean” <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 72]</a>. The three choices of absolute thus give a complete classification: imaginary conic $\Rightarrow$ elliptic (spherical) geometry; degenerate conic $\Rightarrow$ Euclidean geometry; real conic $\Rightarrow$ hyperbolic geometry. This tripartite unification is Klein’s contribution.</p>
</aside>

<h3 id="s2-4-3" data-key="subsec:klein_model_history"><span class="no">2.4.3</span>Klein’s Projective Model and the Erlangen Programme (1871–1872)</h3>

<p>Felix Klein (1849–1925) established the connection between Cayley’s projective metric and Lobachevsky’s geometry in his 1871 paper <i>Über die sogenannte nicht-euklidische Geometrie</i>: when Cayley’s absolute is a real conic, the part of the projective plane inside it is isometric to the Lobachevsky plane <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 73]</a>. In the Klein (Cayley–Klein) model <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;pp. 73–74]</a>, <a class="cite" href="#bib-Sos20" title="Alexei B. Sosinsky. “Ob ekvivalentnosti trekh modelei ploskosti Lobachevskogo [On the Equivalence of Three Models of the Lobachevsky Plane]”. In: Matematicheskoe prosveshchenie, 3r">[Sos20]</a>:</p>

<ul>
  <li>The <em>hyperbolic plane</em> is the open unit disk $\DD = \{(x,y) : x^2+y^2 &lt; 1\}$.</li>
  <li><em>Lines</em> are open chords of the boundary circle.</li>
  <li>The <em>distance</em> between points $A$ and $B$ is a constant multiple of $\ln W$, where $W$ is the cross-ratio of $A$, $B$ and the two points where line $AB$ meets the boundary circle.</li>
  <li><em>Isometries</em> are projective transformations preserving $\DD$.</li>
</ul>

<figure id="fig-2-2">
  <div class="fig-wrap" data-fig="fig:klein_parallels"></div>
  <figcaption><b>Figure 2.2</b> The Klein model, redrawn after Sosinsky <a class="cite" href="#bib-Sos20" title="Alexei B. Sosinsky. “Ob ekvivalentnosti trekh modelei ploskosti Lobachevskogo [On the Equivalence of Three Models of the Lobachevsky Plane]”. In: Matematicheskoe prosveshchenie, 3r">[Sos20,&nbsp;Fig. 3]</a>. <em>Left:</em> the perpendicular $PH$ from $P$ to the line $XY$; the angle at $H$ is a hyperbolic right angle, although it does not look like a Euclidean one. <em>Right:</em> the two parallels $m$ and $k$ through $P$ to the line $\ell$ are the chords through $P$ sharing an endpoint with $\ell$; the shaded region contains the lines through $P$ that do not meet $\ell$ (the dashed chord is one of them).</figcaption>
</figure>

<p>The insight that each such geometry is determined by its group of motions led Klein, who became professor at Erlangen in 1872, to the <em>Erlangen Programme</em>: a <em>geometry</em> is the study of properties invariant under a specified group of transformations <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 73]</a>.</p>

<p>The Klein model is not conformal (angles are distorted) but makes questions of incidence and parallelism geometrically transparent, which makes it valuable for Trajectory 3 students exploring the projective structure of hyperbolic geometry.</p>

<h3 id="s2-4-4" data-key="subsec:poincare_history"><span class="no">2.4.4</span>The Conformal Models</h3>

<p>Two further models of the hyperbolic plane are traditionally named after Henri Poincaré (1854–1912) <a class="cite" href="#bib-Sos20" title="Alexei B. Sosinsky. “Ob ekvivalentnosti trekh modelei ploskosti Lobachevskogo [On the Equivalence of Three Models of the Lobachevsky Plane]”. In: Matematicheskoe prosveshchenie, 3r">[Sos20]</a>:</p>

<ol class="roman">
  <li><b>The Poincaré disk model:</b> the hyperbolic plane is the open unit disk; geodesics are arcs of Euclidean circles orthogonal to the boundary, together with diameters.</li>
  <li><b>The upper half-plane model:</b> the hyperbolic plane is $\HH = \{z \in \CC : \operatorname{Im}(z) &gt; 0\}$; geodesics are vertical rays and semicircles with centre on $\RR$.</li>
</ol>

<figure id="fig-2-3">
  <div class="fig-wrap" data-fig="fig:uhp_parallels_hist"></div>
  <figcaption><b>Figure 2.3</b> Parallels in the upper half-plane model, redrawn after Sosinsky <a class="cite" href="#bib-Sos20" title="Alexei B. Sosinsky. “Ob ekvivalentnosti trekh modelei ploskosti Lobachevskogo [On the Equivalence of Three Models of the Lobachevsky Plane]”. In: Matematicheskoe prosveshchenie, 3r">[Sos20,&nbsp;Fig. 2]</a>. <em>Left:</em> $\ell$ is a semicircle; the two parallels through $P$ are the semicircles through $P$ sharing an endpoint with $\ell$. <em>Right:</em> $\ell$ is a vertical ray; the parallels through $P$ are the vertical ray through $P$ and the semicircle through $P$ ending at the foot of $\ell$. In both pictures the shaded region contains the lines through $P$ that do not meet $\ell$ (the dashed semicircle is one of them).</figcaption>
</figure>

<p>Sosinsky keeps these traditional names but stresses that they are historically unfair: all three standard models — the two “Poincaré” models and the “Cayley–Klein” disk — were devised and published by Beltrami in 1868 <a class="cite" href="#bib-Sos20" title="Alexei B. Sosinsky. “Ob ekvivalentnosti trekh modelei ploskosti Lobachevskogo [On the Equivalence of Three Models of the Lobachevsky Plane]”. In: Matematicheskoe prosveshchenie, 3r">[Sos20,&nbsp;p. 38,&nbsp;n. 1]</a>. We follow the traditional names throughout, as Sosinsky does.</p>

<p>Both models are <em>conformal</em>: angles in the model equal true hyperbolic angles. This makes them ideal for visualisation and for computation via complex analysis. They are the primary models of Trajectories 2 and 3.</p>

<figure id="fig-2-4">
  <div class="fig-wrap" data-fig="fig:poincare_models"></div>
  <figcaption><b>Figure 2.4</b> The two conformal (“Poincaré”) models. <em>Left:</em> the disk model $\DD$; geodesics are circular arcs orthogonal to $\partial\DD$ and diameters. <em>Right:</em> the upper half-plane model $\HH$; geodesics are vertical rays and semicircles with centre on $\RR$. The Cayley map $\varphi(z) = (z-i)/(z+i)$ is an isometry between the models.</figcaption>
</figure>

<h3 id="s2-4-5" data-key="subsec:elliptic_clifford"><span class="no">2.4.5</span>Elliptic Geometry and Clifford’s Parallels (1871–1873)</h3>

<p>Klein’s 1871 paper also completed the projective classification of the constant-curvature geometries by the nature of the Cayley absolute (<a class="xref" href="#s2-4-2">Section 2.4.2</a>); in it he proposed the term “elliptic geometry” alongside “hyperbolic geometry” for Lobachevsky’s <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;pp. 74–75]</a>:</p>

<div class="table-wrap">
<table>
  <thead><tr><th>Absolute</th><th>Geometry</th><th>Curvature</th></tr></thead>
  <tbody>
    <tr><td>Real oval conic (interior used)</td><td>Hyperbolic (Lobachevsky)</td><td>$K &lt; 0$</td></tr>
    <tr><td>Degenerate (imaginary circular points)</td><td>Euclidean</td><td>$K = 0$</td></tr>
    <tr><td>Imaginary conic ($x^2+y^2+z^2=0$)</td><td>Elliptic</td><td>$K &gt; 0$</td></tr>
  </tbody>
</table>
</div>

<p>In elliptic geometry the angle sum of a triangle is always greater than $180^\circ$ <a class="cite" href="#bib-Gre93" title="Marvin Jay Greenberg. Euclidean and Non-Euclidean Geometries: Development and History. 3rd ed. New York: W. H. Freeman, 1993. ISBN: 0-7167-2446-4.">[Gre93,&nbsp;p. 127]</a>.</p>

<p>The three-dimensional elliptic space was studied by William Kingdon Clifford (1845–1879), of whom Klein wrote: “I remember him with particular joy, as a person who understood me completely from the outset and soon carried my research further” <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 75]</a>. In his <i>Preliminary Sketch of Biquaternions</i> (1873), Clifford singled out pairs of lines in elliptic space that have infinitely many common perpendiculars of equal length, and called such lines <em>parallel</em>; today they are called <em>paratactic</em> (or <em>Clifford-parallel</em>) lines. He showed that the parallels to a given line that cross another line sweep out a surface of zero curvature, whose geometry is that of a parallelogram with opposite sides identified <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;pp. 75–76]</a> — topologically a torus. This surface is a ruled quadric and the simplest example of a space with Euclidean geometry and finite volume, the simplest solution of the <em>Clifford–Klein problem</em> of finding spaces with a Euclidean metric that are not isometric to Euclidean space as a whole <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 76]</a>.</p>

<p>The three notions of parallelism known by 1873 thus belong to different geometries <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;pp. 62,&nbsp;76]</a>:</p>

<ul>
  <li><b>Euclidean (“parabolic”) parallels:</b> meet at a point at infinity; exactly one through each external point.</li>
  <li><b>Lobachevsky (hyperbolic) parallels:</b> meet at a point of the absolute; two through each external point.</li>
  <li><b>Clifford (paratactic) parallels:</b> skew lines in 3D elliptic space which, like Euclidean parallels, are equidistant.</li>
</ul>

<h2 class="sec" id="s2-5" data-key="sec:model_significance"><span class="no">2.5</span>The Significance of the Models</h2>

<p>The construction of these models settled the foundational question once and for all: hyperbolic geometry is <em>relatively consistent</em> with Euclidean geometry. If Euclidean geometry contains a contradiction, so does hyperbolic geometry (since a model of the latter exists within the former); but conversely, if Euclidean geometry is consistent, so is hyperbolic geometry. This is the logical content of Beltrami’s 1868 achievement; Laptev and Rozenfeld call these interpretations “the most convincing argument in favour of the new geometry” <a class="cite" href="#bib-KY81" title="A. N. Kolmogorov and A. P. Yushkevich, eds. Matematika XIX veka: geometriia, teoriia analiticheskikh funktsii [Mathematics of the XIXth Century: Geometry, Theory of Analytic Functi">[KY81,&nbsp;p. 69]</a>.</p>

<p>That the parallel postulate is an assumption rather than a necessary truth — not a claim to be proved, but a choice among logically consistent alternatives — is therefore the central message we aim to convey at all three trajectory levels, pitched differently for each:</p>

<ul>
  <li><span class="traj t1">T1</span> “The rules can be different on a curved surface.”</li>
  <li><span class="traj t2">T2</span> “The fifth postulate is one axiom among logically consistent alternatives.”</li>
  <li><span class="traj t3">T3</span> “Hyperbolic geometry is relatively consistent with Euclidean geometry; the Poincaré disk is the proof.”</li>
</ul>

function addPortraits(root){
  Object.keys(PORTRAITS).forEach(function(id){
    const h = root.querySelector('[data-key="'+id.replace(/"/g,'')+'"]'); if(!h) return;
    let anchor = h;
    PORTRAITS[id].forEach(function(pt){
      const f = document.createElement("figure");
      f.className="portrait";
      f.innerHTML='<img src="'+pt.img+'" alt="'+pt.who+'" loading="lazy" referrerpolicy="no-referrer">'+
        '<figcaption><span class="who">'+pt.who+'</span>'+(pt.yrs?'<span class="yrs">'+pt.yrs+'</span>':'')+
        '<span class="credit">'+pt.credit+'. '+(pt.lic||'Public domain')+', <a href="'+pt.page+'" target="_blank" rel="noopener">Wikimedia Commons</a></span></figcaption>';
      anchor.insertAdjacentElement("afterend", f); anchor = f;
    });
  });
}

/* ---------------- figures (coordinates follow the TikZ source) ---------------- */
function figSaccheri(){
  const U=62, ox0=0.7, oy=2.7;                 // tikz unit → px; origin shifts
  const X=(x)=> (x+ox0)*U, Y=(y)=> (oy-y)*U;
  const W=(7.8+2.4+1.4)*U, H=(oy+1.05)*U;
  const P=(x,y)=>X(x).toFixed(1)+","+Y(y).toFixed(1);
  function arc(cx,cy,r,a0,a1){ let pts=[]; for(let i=0;i<=24;i++){const a=(a0+(a1-a0)*i/24)*Math.PI/180; pts.push(P(cx+r*Math.cos(a),cy+r*Math.sin(a)));} return "M"+pts.join(" L"); }
  function bez(x0,h){ // quadratic Bezier D -> C with control (1.2, 2-h)
    let pts=[]; for(let i=0;i<=32;i++){const t=i/32, x=x0+2.4*t, y=(1-t)*(1-t)*2+2*(1-t)*t*(2-h)+t*t*2; pts.push(P(x,y));} return pts;
  }
  const panels=[{x:0,h:0,name:"(H1) right"},{x:3.9,h:-0.5,name:"(H2) obtuse"},{x:7.8,h:0.5,name:"(H3) acute"}];
  let s='<svg viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" role="img" aria-label="Saccheri quadrilaterals under the hypotheses of the right, obtuse and acute angle">';
  panels.forEach(function(p,i){
    const hl = i===2, col = hl ? "var(--fig-2)" : "var(--fig-1)";
    const top = bez(p.x,p.h);
    s+='<path d="M'+P(p.x,0)+' L'+P(p.x+2.4,0)+' L'+top[top.length-1]+' L'+top.slice().reverse().join(" L")+' Z" fill="'+(hl?"var(--fig-fill)":"none")+'" stroke="none"/>';
    s+='<g fill="none" stroke="'+col+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">';
    s+='<path d="M'+P(p.x,0)+' L'+P(p.x+2.4,0)+'"/><path d="M'+P(p.x,0)+' L'+P(p.x,2)+'"/><path d="M'+P(p.x+2.4,0)+' L'+P(p.x+2.4,2)+'"/>';
    s+='<path d="M'+top.join(" L")+'"/></g>';
    s+='<g fill="none" stroke="'+col+'" stroke-width="1.6">';
    s+='<path d="M'+P(p.x+0.25,0)+' L'+P(p.x+0.25,0.25)+' L'+P(p.x,0.25)+'"/>';
    s+='<path d="M'+P(p.x+2.15,0)+' L'+P(p.x+2.15,0.25)+' L'+P(p.x+2.4,0.25)+'"/>';
    s+='<path d="M'+P(p.x-0.1,1)+' L'+P(p.x+0.1,1)+'"/><path d="M'+P(p.x+2.3,1)+' L'+P(p.x+2.5,1)+'"/>';
    if(p.h===0){
      s+='<path d="M'+P(p.x,1.75)+' L'+P(p.x+0.25,1.75)+' L'+P(p.x+0.25,2)+'"/>';
      s+='<path d="M'+P(p.x+2.4,1.75)+' L'+P(p.x+2.15,1.75)+' L'+P(p.x+2.15,2)+'"/>';
    } else {
      const t=Math.atan2(-p.h,1.2)*180/Math.PI;          // summit tangent at D
      s+='<path d="'+arc(p.x,2,0.3,-90,t)+'"/>';
      s+='<path d="'+arc(p.x+2.4,2,0.3,180-t,270)+'"/>';
    }
    s+='</g>';
    s+='<g fill="'+col+'" font-size="23" font-style="italic">';
    s+='<text x="'+(X(p.x)-22)+'" y="'+(Y(0)+22)+'">A</text>';
    s+='<text x="'+(X(p.x+2.4)+6)+'" y="'+(Y(0)+22)+'">B</text>';
    s+='<text x="'+(X(p.x+2.4)+6)+'" y="'+(Y(2)-8)+'">C</text>';
    s+='<text x="'+(X(p.x)-22)+'" y="'+(Y(2)-8)+'">D</text></g>';
    s+='<text x="'+X(p.x+1.2)+'" y="'+(Y(-0.62))+'" text-anchor="middle" font-size="21" fill="'+col+'"'+(hl?' font-weight="600"':'')+'>'+p.name+'</text>';
  });
  return s+'</svg>';
}

function figPoincare(){
  const U=95, W=8.4*U, H=4.05*U;
  // disk centred at tikz (-2.2,0); half-plane at xshift 2.2. Map tikz (x,y) → svg.
  const X=(x)=> (x+4.2)*U, Y=(y)=> (2.6-y)*U;
  const P=(x,y)=>X(x).toFixed(1)+","+Y(y).toFixed(1);
  function arcPath(cx,cy,r,a0,a1,n){ n=n||40; let pts=[]; for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180; pts.push(P(cx+r*Math.cos(a),cy+r*Math.sin(a)));} return "M"+pts.join(" L"); }
  const dx=-2.2, hx=2.2, r3=Math.sqrt(3);
  let s='<svg viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" role="img" aria-label="Poincaré disk and upper half-plane with geodesics">';
  // --- disk
  s+='<circle cx="'+X(dx)+'" cy="'+Y(0)+'" r="'+U+'" fill="var(--fig-fill)" stroke="var(--fig-1)" stroke-width="2.6"/>';
  s+='<g fill="none" stroke-width="3" stroke-linecap="round">';
  s+='<path d="M'+P(dx,-1)+' L'+P(dx,1)+'" stroke="var(--fig-2)"/>';                         // diameter
  s+='<path d="'+arcPath(dx+2,0,r3,150,210)+'" stroke="var(--fig-3)"/>';                     // centre (2,0), r=√3
  s+='<path d="'+arcPath(dx,2,r3,-60,-120)+'" stroke="var(--fig-1)"/>';                      // centre (0,2), r=√3
  s+='</g>';
  [0,90,180,270].forEach(function(a){ const t=a*Math.PI/180; s+='<circle cx="'+X(dx+Math.cos(t))+'" cy="'+Y(Math.sin(t))+'" r="3" fill="var(--fig-1)"/>'; });
    s+='<text x="'+(X(dx+1)+8)+'" y="'+(Y(0)+8)+'" font-size="22" fill="var(--fig-1)">∂𝔻</text>';
  s+='<text x="'+X(dx)+'" y="'+(Y(1.12)-4)+'" text-anchor="middle" font-size="23" font-weight="600" fill="var(--fig-1)">Poincaré Disk 𝔻</text>';
  s+='<text x="'+X(dx)+'" y="'+(Y(-1.12)+24)+'" text-anchor="middle" font-size="20" fill="var(--fig-1)" opacity=".75">conformal</text>';
  // --- half-plane
  s+='<rect x="'+X(hx-1.3)+'" y="'+Y(2.0)+'" width="'+(2.6*U)+'" height="'+(2*U)+'" fill="var(--fig-fill)"/>';
  s+='<path d="M'+P(hx-1.3,0)+' L'+P(hx+1.3,0)+'" stroke="var(--fig-1)" stroke-width="2.6"/>';
  s+='<g fill="none" stroke-width="3" stroke-linecap="round">';
  s+='<path d="M'+P(hx,0)+' L'+P(hx,2)+'" stroke="var(--fig-2)"/>';
  s+='<path d="'+arcPath(hx-0.6,0,0.7,180,0)+'" stroke="var(--fig-3)"/>';
  s+='<path d="'+arcPath(hx+0.7,0,0.5,180,0)+'" stroke="var(--fig-1)"/>';
  s+='</g>';
    s+='<text x="'+(X(hx+1.3)+8)+'" y="'+(Y(0)+8)+'" font-size="22" fill="var(--fig-1)">ℝ</text>';
  s+='<text x="'+(X(hx-1.25))+'" y="'+(Y(1.5)+4)+'" font-size="20" font-style="italic" fill="var(--fig-1)">y &gt; 0</text>';
  s+='<text x="'+X(hx)+'" y="'+(Y(2.08)-4)+'" text-anchor="middle" font-size="23" font-weight="600" fill="var(--fig-1)">Upper Half-Plane ℍ</text>';
  s+='<text x="'+X(hx)+'" y="'+(Y(-0.12)+24)+'" text-anchor="middle" font-size="20" fill="var(--fig-1)" opacity=".75">conformal</text>';
  // --- Cayley map arrow
  const ay=Y(0.5), ax0=X(-0.62), ax1=X(0.62);
  s+='<g stroke="var(--muted)" stroke-width="2.2" fill="none"><path d="M'+ax0+','+ay+' L'+ax1+','+ay+'"/><path d="M'+(ax0+10)+','+(ay-6)+' L'+ax0+','+ay+' L'+(ax0+10)+','+(ay+6)+'"/><path d="M'+(ax1-10)+','+(ay-6)+' L'+ax1+','+ay+' L'+(ax1-10)+','+(ay+6)+'"/></g>';
  s+='<text x="'+X(0)+'" y="'+(ay-10)+'" text-anchor="middle" font-size="20" fill="var(--muted)">Cayley map <tspan font-style="italic">φ</tspan></text>';
  return s+'</svg>';
}


/* Shared helpers for figures drawn from TikZ coordinates (y up). */
function frame(x0,x1,y0,y1,U){
  const X=(x)=>((x-x0)*U), Y=(y)=>((y1-y)*U);
  return {X:X,Y:Y,W:(x1-x0)*U,H:(y1-y0)*U,P:(x,y)=>X(x).toFixed(1)+","+Y(y).toFixed(1),
    arc:function(cx,cy,r,a0,a1,n){ n=n||48; let pts=[]; for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180; pts.push(X(cx+r*Math.cos(a)).toFixed(1)+","+Y(cy+r*Math.sin(a)).toFixed(1));} return pts; }};
}
function dot(F,x,y,r,hollow){ return '<circle cx="'+F.X(x).toFixed(1)+'" cy="'+F.Y(y).toFixed(1)+'" r="'+r+'" fill="'+(hollow?'var(--sheet)':'var(--fig-1)')+'" stroke="var(--fig-1)" stroke-width="1.6"/>'; }
function lbl(F,x,y,t,o){ o=o||{}; return '<text x="'+(F.X(x)+(o.dx||0)).toFixed(1)+'" y="'+(F.Y(y)+(o.dy||0)).toFixed(1)+'" font-size="'+(o.size||24)+'" font-style="'+(o.it===false?'normal':'italic')+'" text-anchor="'+(o.anchor||'middle')+'" fill="var(--fig-1)">'+t+'</text>'; }
function seg(F,a,b,o){ o=o||{}; return '<path d="M'+F.P(a[0],a[1])+' L'+F.P(b[0],b[1])+'" stroke="'+(o.col||'var(--fig-1)')+'" stroke-width="'+(o.w||2.6)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+' fill="none" stroke-linecap="round"/>'; }

  const a1=F.arc(R(1.625),0,1.625,180,112.62), a2=F.arc(R(1.625),0,1.625,0,112.62);
  s+='<path d="M'+a1.join(' L')+' L'+F.P(R(1),0)+' Z" fill="var(--fig-3)" fill-opacity=".35" stroke="none"/>';
  s+='<path d="M'+F.P(R(1),1.5)+' L'+F.P(R(1),2.5)+' L'+F.P(R(3.6),2.5)+' L'+F.P(R(3.6),0)+' L'+a2.join(' L')+' Z" fill="var(--fig-3)" fill-opacity=".35" stroke="none"/>';
  s+='<path d="M'+F.arc(R(1.625),0,1.625,0,180).join(' L')+'" stroke="var(--fig-1)" stroke-width="2" fill="none"/>';
  s+=seg(F,[R(1),0],[R(1),2.5],{w:2});
  s+='<path d="M'+F.arc(R(2.575),0,2.175,0,180).join(' L')+'" stroke="var(--fig-1)" stroke-width="2" stroke-dasharray="9 7" fill="none"/>';
  s+='</g>';
  s+=seg(F,[R(0),0],[R(0),2.5],{w:3.6});
  s+=lbl(F,R(0),2.2,'ℓ',{dx:-16,dy:8});
  s+=seg(F,[R(-0.1),0],[R(3.6),0],{w:2.2,dash:'2 6'});
  s+=dot(F,R(1),1.5,5)+lbl(F,R(1),1.5,'P',{dx:-16,dy:-10});
  s+=lbl(F,R(2.3),0.8,'ℍ',{dy:8,it:false});
  return s+'</svg>';
}

const FIGS = {
  "fig:saccheri_quad": figSaccheri,
  "fig:klein_parallels": figKlein,

/* ---------------- build tabs + panels ---------------- */
const tablist = document.getElementById("tablist");
const main = document.getElementById("main");
const panels = {};

CHAPTERS.forEach(function(ch){
  const b = document.createElement("button");
  b.className="tab"; b.id="tab-"+ch.id; b.setAttribute("role","tab"); b.setAttribute("aria-controls",ch.id);
  b.innerHTML='<span class="num">'+ch.num+'</span><span>'+ch.short+'</span>'+(ch.full?'':'<span class="dot" title="'+S.draftTag+'"></span>');
  b.addEventListener("click",function(){ show(ch.id,true); });
  tablist.appendChild(b);

  const sec = document.createElement("section");
  sec.id=ch.id; sec.setAttribute("role","tabpanel"); sec.setAttribute("aria-labelledby","tab-"+ch.id); sec.hidden=true;
  if(ch.full){
    const tpl = document.getElementById(LANG+"-"+ch.id);
    sec.className="chapter has-toc";
    sec.innerHTML='<nav class="toc" aria-label="'+S.contents+'"><div class="toc-inner"><details open><summary>'+S.contents+'</summary><ol id="toc-'+ch.id+'"></ol></details></div></nav><article class="book">'+tpl.innerHTML+'</article>';
  } else {
    sec.className="chapter";
    const eyebrow = ch.appendix ? S.appendix : S.chapter+" "+ch.num;
    let h='<article class="book"><p class="eyebrow">'+eyebrow+'</p><h2 class="ch-title">'+ch.title+'</h2>';
    h+='<div class="draft-banner"><strong>'+S.draftTag+'</strong><span>'+S.draftMsg+'</span></div>';
    h+='<p class="sample-label">'+S.sampleText+'</p>';
    ch.sample.forEach(function(t){ h+='<p>'+t+'</p>'; });
    h+='<p class="sample-label">'+S.sampleEx+'</p><div class="exercise"><p>'+ch.ex+'</p></div>';
    if(ch.sections.length){
      h+='<p class="sample-label">'+S.planned+'</p><ol class="planned">';
      ch.sections.forEach(function(t){ h+='<li>'+t+'</li>'; });
      h+='</ol>';
    }
    sec.innerHTML=h+'</article>';
  }
  main.appendChild(sec); panels[ch.id]=sec;
});

addPortraits(panels.ch2);
document.querySelectorAll("[data-fig]").forEach(function(el){
  const f = FIGS[el.getAttribute("data-fig")];
  el.innerHTML = f ? f() : '<p class="fig-pending">This figure is in the thesis PDF; the web version is being drawn.</p>';
  if(el.hasAttribute("data-fig-stale")) el.insertAdjacentHTML("beforeend",'<p class="fig-pending">This figure was changed in the thesis; the web drawing may still show the previous version.</p>');
});

/* table of contents for chapter 2 */
(function(){
  const ol = document.getElementById("toc-ch2");
  const heads = panels.ch2.querySelectorAll(".book h2.sec, .book h3");
  heads.forEach(function(h){
    const li=document.createElement("li"), a=document.createElement("a");
    a.href="#"+h.id; a.className = h.tagName==="H3" ? "lvl3" : "lvl2";
    a.textContent = h.textContent.replace(/^(\d+(\.\d+)*)/,"$1 ");
    li.appendChild(a); ol.appendChild(li);
  });
  // highlight current section
  const links = ol.querySelectorAll("a");
  if("IntersectionObserver" in window){
    const io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          links.forEach(function(l){ l.classList.toggle("on", l.getAttribute("href")==="#"+e.target.id); });
        }
      });
    },{rootMargin:"-15% 0px -75% 0px"});
    heads.forEach(function(h){ io.observe(h); });
  }
})();

/* math */
function renderMath(){
  if(!window.renderMathInElement) return;
  try{
    renderMathInElement(main,{
      delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],
      output:"mathml", throwOnError:false,
      macros:{"\\DD":"\\mathbb{D}","\\HH":"\\mathbb{H}","\\CC":"\\mathbb{C}","\\RR":"\\mathbb{R}"}
    });
    // Chrome's MathML ignores mathvariant="double-struck": swap in the Unicode letters.
    const BB={D:"\u{1D53B}",H:"\u210D",C:"\u2102",R:"\u211D"};
    main.querySelectorAll('mi[mathvariant="double-struck"]').forEach(function(mi){
      const c=mi.textContent; if(BB[c]){ mi.textContent=BB[c]; mi.setAttribute("mathvariant","normal"); }
    });
  }catch(e){}
}
renderMath();

/* ---------------- routing ---------------- */
function owner(id){
  if(panels[id]) return id;
  const el = document.getElementById(id);
  if(!el) return null;
  const p = el.closest('[role="tabpanel"]');
  return p ? p.id : null;
}
function show(id,fromClick){
  Object.keys(panels).forEach(function(k){
    panels[k].hidden = k!==id;
    document.getElementById("tab-"+k).setAttribute("aria-selected", k===id ? "true":"false");
  });
  const tab=document.getElementById("tab-"+id);
  tab.scrollIntoView({block:"nearest",inline:"nearest"});
  save("tc-tab",id);
  if(fromClick){
    try{ history.replaceState(null,"","#"+id); }catch(e){}
    window.scrollTo({top:0});
  }
}
function go(hash){
  const id = (hash||"").replace(/^#/,"");
  const o = id && owner(id);
  if(!o) return false;
  show(o,false);
  if(id!==o){
    const el=document.getElementById(id);
    requestAnimationFrame(function(){
      el.scrollIntoView({block:"start"});
      if(id.indexOf("bib-")===0){
        const dd = el.nextElementSibling;
        [el,dd].forEach(function(n){ n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash"); });
      }
    });
  } else window.scrollTo({top:0});
  return true;
}
main.addEventListener("click",function(e){
  const a = e.target.closest('a[href^="#"]');
  if(!a) return;
  e.preventDefault();
  const h=a.getAttribute("href");
  if(go(h)){ try{ history.replaceState(null,"",h); }catch(err){} }
});
window.addEventListener("hashchange",function(){ go(location.hash); });

if(!go(location.hash)){
  const last = load("tc-tab");
  show(panels[last] ? last : "ch2", false);
}
})();
</script>
