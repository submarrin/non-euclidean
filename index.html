<h2 class="ch-title">The Parallel Postulate from Euclid to Hilbert</h2>

<p>In the history of non-Euclidean geometry, a two-thousand-year effort to <em>prove</em> a postulate ended, paradoxically, in the proof of its <em>independence</em>: it cannot be derived from Euclid’s other postulates <a class="xref" href="#E1">(E1)</a>–<a class="xref" href="#E4">(E4)</a> or, in modern terms, from the axioms of absolute geometry (<a class="xref" href="#s2-1">Section 2.1</a>). The same effort led to the discovery that the alternatives yield equally consistent geometries. This chapter traces that development, drawing on Greenberg’s history of the parallel postulate <a class="cite" href="#bib-Gre93" data-cite="[Gre93]" aria-label="Citation [Gre93]">c</a>, the Russian historical synthesis of Laptev and Rozenfeld <a class="cite" href="#bib-KY81" data-cite="[KY81]" aria-label="Citation [KY81]">c</a>, and the modern treatments of Galperin <a class="cite" href="#bib-Gal20" data-cite="[Gal20]" aria-label="Citation [Gal20]">c</a> and Sosinsky <a class="cite" href="#bib-Sos20" data-cite="[Sos20]" aria-label="Citation [Sos20]">c</a>.</p>

<h2 class="sec" id="s2-1" data-key="sec:euclid_parallel"><span class="no">2.1</span>Euclid and the Parallel Postulate</h2>

<p>Euclid’s <i>Elements</i> (c. 300 BCE) organises plane geometry around five postulates. In the standard translation of Heath <a class="cite" href="#bib-Euc56" data-cite="[Euc56, Book I, Postulates]" aria-label="Citation [Euc56, Book I, Postulates]">c</a>, they read:</p>

<ol class="axioms">
  <li id="E1"><span class="lab">(E1)</span><span>To draw a straight line from any point to any point.</span></li>
  <li><span class="lab">(E2)</span><span>To produce a finite straight line continuously in a straight line.</span></li>
  <li><span class="lab">(E3)</span><span>To describe a circle with any centre and distance.</span></li>
  <li id="E4"><span class="lab">(E4)</span><span>That all right angles are equal to one another.</span></li>
  <li id="E5"><span class="lab">(E5)</span><span><b>(The Parallel Postulate.)</b> That, if a straight line falling on two straight lines make the interior angles on the same side less than two right angles, the two straight lines, if produced indefinitely, meet on that side on which are the angles less than the two right angles.</span></li>
</ol>

<p>The fifth postulate <a class="xref" href="#E5">(E5)</a> is longer and structurally different from the first four. Euclid himself appears not to have quite trusted it: he postponed using it in a proof for as long as possible, until his 29th proposition <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 148]" aria-label="Citation [Gre93, p. 148]">c</a>. The theorems that can be proved without it form what is now called <em>neutral</em> (or <em>absolute</em>) geometry: all theorems that follow from the axioms of incidence, betweenness, congruence and continuity alone, without the axiom of parallelism <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 116]" aria-label="Citation [Gre93, p. 116]">c</a>.</p>

<aside class="hnote" id="hn-playfair">
  <p class="hn-title">Historical Note 2.1 <em>Playfair’s Equivalent Formulation</em></p>
  <p>The most convenient modern form of <a class="xref" href="#E5">(E5)</a> is <em>Playfair’s axiom</em> (in Hilbert’s system, the <em>parallel postulate</em>): <i>through a given point not on a given line, there exists exactly one line parallel to the given line.</i> In neutral geometry it is logically equivalent to <a class="xref" href="#E5">(E5)</a> <a class="cite" href="#bib-Gre93" data-cite="[Gre93, Thm. 4.5, pp. 128–129]" aria-label="Citation [Gre93, Thm. 4.5, pp. 128–129]">c</a>.</p>
</aside>

<h2 class="sec" id="s2-2" data-key="sec:attempted_proofs"><span class="no">2.2</span>Two Thousand Years of Attempted Proofs</h2>

<p>For over two thousand years some of the best mathematicians tried to derive the parallel postulate from the other axioms <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 149]" aria-label="Citation [Gre93, p. 149]">c</a>. Every attempt failed, and usually in an instructive way: once the flawed step is located, it turns out to be another statement equivalent to the parallel postulate <a class="cite" href="#bib-Gre93" data-cite="[Gre93, pp. 148–149]" aria-label="Citation [Gre93, pp. 148–149]">c</a>. By 1763 G. S. Klügel could write a doctoral thesis locating the flaws in 28 different supposed proofs, and d’Alembert called the situation “the scandal of geometry” <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 161]" aria-label="Citation [Gre93, p. 161]">c</a>.</p>

<h3 id="s2-2-1" data-key="Proclus and the Islamic Tradition"><span class="no">2.2.1</span>Proclus and the Islamic Tradition</h3>

<p>Proclus (410–485 CE) held that the postulate “ought even to be struck out of the Postulates altogether; for it is a theorem involving many difficulties,” and attempted a proof of his own <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 149]" aria-label="Citation [Gre93, p. 149]">c</a>. Its final step tacitly treats two parallel lines as staying a constant distance apart. This cannot be proved in neutral geometry without the parallel postulate itself, so the argument is circular <a class="cite" href="#bib-Gre93" data-cite="[Gre93, pp. 150–151]" aria-label="Citation [Gre93, pp. 150–151]">c</a>.</p>

<p>Mathematicians of the Islamic world worked on the same problem. The quadrilaterals now named after Saccheri were studied centuries earlier by Omar Khayyam and Nasir Eddin al-Tusi, and those now named after Lambert by Ibn al-Haytham <a class="cite" href="#bib-Gre93" data-cite="[Gre93, pp. 155, 160]" aria-label="Citation [Gre93, pp. 155, 160]">c</a>; al-Tusi’s own attempted proof rested on several unjustified assumptions <a class="cite" href="#bib-Gre93" data-cite="[Gre93, pp. 151–152]" aria-label="Citation [Gre93, pp. 151–152]">c</a>.</p>

<h3 id="s2-2-2" data-key="subsec:saccheri"><span class="no">2.2.2</span>Saccheri’s Quadrilateral (1733)</h3>

<p>The Jesuit priest and logician Girolamo Saccheri (1667–1733) published, just before his death, <i>Euclides ab omni naevo vindicatus</i> (“Euclid Freed of Every Flaw”). In this book Saccheri tried to prove the parallel postulate by <em>reductio ad absurdum</em>, that is, by proof by contradiction: he assumed the negation of the parallel postulate and tried to deduce a contradiction. His tool was the quadrilateral $ABCD$ with right angles at $A$ and $B$ and equal legs $AD = BC$ (<a class="xref" href="#fig-2-1">Figure 2.1</a>), now called the <em>Saccheri quadrilateral</em> <a class="cite" href="#bib-Gre93" data-cite="[Gre93, pp. 154–155]" aria-label="Citation [Gre93, pp. 154–155]">c</a>. The book went largely unnoticed until Beltrami rediscovered it a century and a half later <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 154]" aria-label="Citation [Gre93, p. 154]">c</a>.</p>

<p>It is easy to prove in neutral geometry that the summit angles $\angle C$ and $\angle D$ are congruent, which leaves three cases <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 155]" aria-label="Citation [Gre93, p. 155]">c</a>:</p>

<ol class="hyp">
  <li id="HRA"><span class="lab">(H1)</span><span><b>Hypothesis of the Right Angle:</b> the summit angles are right angles, so $ABCD$ is a rectangle. This is the Euclidean case: the existence of a rectangle is equivalent in neutral geometry to the parallel postulate <a class="cite" href="#bib-Gre93" data-cite="[Gre93, pp. 156–157]" aria-label="Citation [Gre93, pp. 156–157]">c</a>.</span></li>
  <li id="HOA"><span class="lab">(H2)</span><span><b>Hypothesis of the Obtuse Angle:</b> the summit angles are obtuse. Saccheri succeeded in showing that this case leads to a contradiction. In modern terms, the angle sum of the quadrilateral would exceed $360^\circ$, contradicting a corollary of the Saccheri–Legendre theorem (to be proved in <a class="xref" href="#ch3">Chapter 3</a>) <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 155]" aria-label="Citation [Gre93, p. 155]">c</a>.</span></li>
  <li id="HAA"><span class="lab">(H3)</span><span><b>Hypothesis of the Acute Angle:</b> the summit angles are acute. However hard he tried, Saccheri could not squeeze a contradiction out of this case. He deduced many strange results and finally declared that “the hypothesis of the acute angle is absolutely false, because [it is] repugnant to the nature of the straight line!” <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 155]" aria-label="Citation [Gre93, p. 155]">c</a></span></li>
</ol>

<p>As Greenberg puts it, although he did not recognise it, Saccheri had discovered non-Euclidean geometry <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 155]" aria-label="Citation [Gre93, p. 155]">c</a>.</p>

<h3 id="s2-2-3" data-key="subsec:lambert"><span class="no">2.2.3</span>Lambert’s Quadrilateral and the “Imaginary Sphere”</h3>

<p>Johann Heinrich Lambert (1728–1777) studied quadrilaterals with three right angles, now named after him. Like Saccheri, he disproved the obtuse-angle hypothesis and studied the consequences of the acute one: he observed that it forces similar triangles to be congruent, and hence implies an absolute unit of length, and he noticed that the defect of a triangle is proportional to its area <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 160]" aria-label="Citation [Gre93, p. 160]">c</a>. On a sphere of radius $r$ the area of a triangle is $r^2$ times its <em>excess</em>, the amount by which its angle sum exceeds $180^\circ$. Replacing $r$ by $ir$ changes $r^2$ into $-r^2$, which turns the excess into a defect: the area becomes $r^2$ times the defect. Lambert therefore speculated that the acute-angle hypothesis describes geometry on a “sphere of imaginary radius” <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 160]" aria-label="Citation [Gre93, p. 160]">c</a>. On the sphere itself the area formula is known as Girard’s theorem <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 397]" aria-label="Citation [Gre93, p. 397]">c</a>; <a class="xref" href="#ch3">Chapter 3</a> proves it and shows that on the sphere, too, similar triangles are congruent. The same idea returns in Cayley’s projective metric (<a class="xref" href="#s2-4-2">Section 2.4.2</a>). Lambert did not submit his <i>Theorie der Parallellinien</i> (<i>Theory of Parallels</i>) for publication; it was published posthumously in 1786 <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 161]" aria-label="Citation [Gre93, p. 161]">c</a>.</p>

<h3 id="s2-2-4" data-key="subsec:legendre"><span class="no">2.2.4</span>Legendre’s Attempts (1794–1833)</h3>

<p>Adrien-Marie Legendre (1752–1833) returned to the parallel postulate in edition after edition of his influential textbook <i>Éléments de géométrie</i>, offering a new “proof” each time. In the fourteenth and last edition he admitted that the only thing he had managed to prove about the angles of a triangle is that their sum does not exceed $180^\circ$ <a class="cite" href="#bib-Gal20" data-cite="[Gal20, pp. 22, 25–26]" aria-label="Citation [Gal20, pp. 22, 25–26]">c</a>. Legendre did not know of Saccheri’s work and <em>rediscovered</em> Saccheri’s two main theorems of neutral geometry <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 157]" aria-label="Citation [Gre93, p. 157]">c</a>; Galperin notes that Saccheri had anticipated him in both <a class="cite" href="#bib-Gal20" data-cite="[Gal20, p. 36]" aria-label="Citation [Gal20, p. 36]">c</a>.</p>

<p>In modern form, the two theorems read as follows <a class="cite" href="#bib-Gre93" data-cite="[Gre93, Thm. 4.4, p. 125; Thm. 4.7, pp. 131–134]" aria-label="Citation [Gre93, Thm. 4.4, p. 125; Thm. 4.7, pp. 131–134]">c</a>:</p>

<ol class="hyp">
  <li><span class="lab">Theorem&nbsp;1.</span><span>In neutral geometry the angle sum of every triangle is at most $180^\circ$.</span></li>
  <li><span class="lab">Theorem&nbsp;2.</span><span>If one triangle has angle sum exactly $180^\circ$, then a rectangle exists; and if a rectangle exists, then every triangle has angle sum $180^\circ$.</span></li>
</ol>

<p>The first is today called the <em>Saccheri–Legendre theorem</em>, a name that appeared only in the twentieth century <a class="cite" href="#bib-Gal20" data-cite="[Gal20, p. 36]" aria-label="Citation [Gal20, p. 36]">c</a>. Both theorems will be proved in <a class="xref" href="#ch3">Chapter 3</a>. Legendre’s proof of the first rests on what Galperin calls the <em>siphon construction</em>, since one triangle “flows” into another as in a siphon <a class="cite" href="#bib-Gal20" data-cite="[Gal20, p. 36]" aria-label="Citation [Gal20, p. 36]">c</a>: given $\triangle ABC$, doubling the median from one vertex produces a new triangle with the same angle sum, one of whose angles is at most half the angle at that vertex. Repeating this, Legendre showed that an angle sum greater than $180^\circ$ would eventually force a single angle of a triangle to exceed $180^\circ$, which is impossible <a class="cite" href="#bib-Gal20" data-cite="[Gal20, pp. 26–29]" aria-label="Citation [Gal20, pp. 26–29]">c</a>. Legendre’s proofs were elegant enough that Lobachevsky later used them in his own work <a class="cite" href="#bib-Gal20" data-cite="[Gal20, p. 36]" aria-label="Citation [Gal20, p. 36]">c</a>.</p>

<p>Legendre’s attempts to prove that the angle sum is <em>exactly</em> $180^\circ$ all contained a flaw <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 158]" aria-label="Citation [Gre93, p. 158]">c</a>. In one of them, every step can be justified except a single unproved assumption: that through any point in the interior of an acute angle there passes a line meeting both sides of the angle <a class="cite" href="#bib-Bon12" data-cite="[Bon12, pp. 58–59]" aria-label="Citation [Bon12, pp. 58–59]">c</a>. That assumption is itself equivalent to the parallel postulate. It is the same hidden error made centuries earlier by Simplicius, al-Jawhari and al-Tusi <a class="cite" href="#bib-Gre93" data-cite="[Gre93, pp. 157–159]" aria-label="Citation [Gre93, pp. 157–159]">c</a>. Legendre published a collection of his many attempts as late as 1833, the year he died <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 157]" aria-label="Citation [Gre93, p. 157]">c</a>.</p>

<div class="authorview">
  <p>Proclus, al-Tusi, Saccheri and Legendre all used a similar method: they made an assumption that looked obvious but turned out to be equivalent to the postulate itself. This pattern shows that pictures and intuition can mislead in a proof: they let in assumptions that may not be explicitly stated or justified. Proclus’s argument is a clear case: it silently treats parallel lines as everywhere equidistant, and the same picture of parallels as railway tracks reappears as a typical student misconception (see <a class="xref" href="#ch5">Chapter 5</a>). The lesson is to reason carefully and to question what seems intuitively obvious. In teaching, this means asking students to state their assumptions and to justify every step, so that they see what a proof actually requires.</p>
</div>

<h2 class="sec" id="s2-3" data-key="sec:19c_discovery"><span class="no">2.3</span>The Nineteenth-Century Discovery</h2>

<p>Three mathematicians, working independently with different emphases, arrived at a non-Euclidean geometry in the first third of the nineteenth century.</p>

<h3 id="s2-3-1" data-key="subsec:gauss"><span class="no">2.3.1</span>Carl Friedrich Gauss (1777–1855)</h3>

<p>Gauss reached a clear understanding of non-Euclidean geometry, but he published nothing on the subject and confined himself to brief remarks in letters to a few friends <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 67]" aria-label="Citation [KY81, p. 67]">c</a>. In an 1817 letter to the astronomer Wilhelm Olbers he wrote of being “more and more convinced that the necessity of our geometry cannot be proved”. A year later, writing to the astronomer C. L. Gerling, he welcomed his correspondent’s willingness to doubt Euclidean geometry while warning that “the wasps whose nest you disturb will fly about your head” <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 60]" aria-label="Citation [KY81, p. 60]">c</a>. Laptev and Rozenfeld connect his silence with his move away from the Kantian view that geometric concepts are given a priori; by the “wasps” Gauss apparently meant the defenders of that traditional view <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 60]" aria-label="Citation [KY81, p. 60]">c</a>. He was more explicit in 1829, the year Lobachevsky’s first memoir appeared, when he told the astronomer Bessel that he might never decide to publish his views in his lifetime, “because I fear the clamour of the Boeotians [that is, of the ignorant], which will arise when I state my views in full” (our translation from the Russian of <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 251]" aria-label="Citation [Yus68, p. 251]">c</a>). For fear of the same clamour, Yushkevich adds, Gauss never gave public support to Lobachevsky or Bolyai, although he praised their work highly in letters to friends <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 251]" aria-label="Citation [Yus68, p. 251]">c</a>.</p>

<p>When Bolyai’s work reached him, Gauss called its author, in a letter to Gerling, “a genius of the first magnitude”, yet wrote to Bolyai’s father that he could not praise it, since “to praise it would be to praise myself”: its results coincided almost entirely with his own, some of them “thirty to thirty-five years” old <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 61]" aria-label="Citation [KY81, p. 61]">c</a>.</p>

<h3 id="s2-3-2" data-key="subsec:lobachevsky"><span class="no">2.3.2</span>Nikolai Ivanovich Lobachevsky (1792–1856)</h3>

<p>Lobachevsky, whose whole career was bound up with Kazan University, was the first to <em>publish</em> a systematic non-Euclidean geometry. By 1826 he was convinced that the fifth postulate does not follow from the other axioms, and on 11 (23) February 1826 he presented the foundations of his “imaginary geometry” in a report at a meeting of the faculty <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 58]" aria-label="Citation [KY81, p. 58]">c</a>. The report became part of his first publication, the memoir <i>On the Foundations of Geometry</i>, which appeared in the university’s journal, the <i>Kazan Messenger</i>, in 1829–1830. It was followed by <i>Imaginary Geometry</i> (1835), <i>Application of Imaginary Geometry to Certain Integrals</i> (1836), <i>New Foundations of Geometry with a Complete Theory of Parallels</i> (1835–1838), the German treatise <i>Geometrische Untersuchungen zur Theorie der Parallellinien</i> (“Geometrical Researches on the Theory of Parallels”, 1840) <a class="cite" href="#bib-Lob40" data-cite="[Lob40]" aria-label="Citation [Lob40]">c</a>, and finally <i>Pangeometry</i> (1855–1856), written in Russian and French <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 59]" aria-label="Citation [KY81, p. 59]">c</a>.</p>

<p><b class="para-head">Philosophy.</b> Laptev and Rozenfeld <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 58]" aria-label="Citation [KY81, p. 58]">c</a> emphasise that Lobachevsky’s philosophical foundation was <em>empiricist</em>: he held that geometric concepts are abstracted from physical experience, so the question of which geometry is “true” is empirical rather than a priori. In <i>On the Foundations of Geometry</i> he wrote (our translation): “The first concepts with which any science begins must be clear and reduced to the smallest number. Only then can they serve as a firm and sufficient foundation for the theory. Such concepts are acquired through the senses; innate ones should not be trusted” <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 58]" aria-label="Citation [KY81, p. 58]">c</a>. In this way he rejected the view, held by Kant, that geometric concepts are a priori, from which it had been concluded that Euclidean geometry is the only conceivable one <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 58]" aria-label="Citation [KY81, p. 58]">c</a>.</p>

<p><b class="para-head">The new geometry.</b> Lobachevsky’s positive contribution was a complete trigonometry for his <em>“imaginary geometry”</em>, in which through every point not on a given line there pass two lines parallel to that line, and the angle of parallelism is given by $\Pi(a) = 2\arctan e^{-a/q}$ for a constant $q$ <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 62]" aria-label="Citation [KY81, p. 62]">c</a> (to be proved in <a class="xref" href="#ch3">Chapter 3</a>). The constant $q$ is a length characterising the space: in theory it can take any positive value, different values give different Lobachevsky spaces, and as $q \to \infty$ the geometry becomes Euclidean <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 243]" aria-label="Citation [Yus68, p. 243]">c</a>. In this geometry the area of a triangle equals $q^2\delta$, where $\delta$ is its defect <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 63]" aria-label="Citation [KY81, p. 63]">c</a>. He also put the geometry to work in analysis: by computing lengths, areas and volumes of figures in two ways, geometrically and analytically, he found the values of about fifty difficult definite integrals. Where some of these values were already known, the agreement strengthened his confidence that the new geometry was free of contradiction <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 248]" aria-label="Citation [Yus68, p. 248]">c</a>. Yet neither these computations nor the long development of the theory without any contradiction amounted to a proof of its consistency: correct results can be obtained from false premises, and Lobachevsky was aware of this <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 249]" aria-label="Citation [Yus68, p. 249]">c</a>.</p>

<p><b class="para-head">Which geometry is real?</b> For Lobachevsky the geometry of physical space was a question for experiment. He chose the angle sum of a triangle as the testable quantity and estimated it from astronomical data for an enormous triangle whose vertices are two diametrically opposite positions of the Earth on its orbit and the star Sirius. He found no noticeable deviation from $180^\circ$ <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 247]" aria-label="Citation [Yus68, p. 247]">c</a>. Since the two geometries differ very little when the constant $q$ is large compared with the figures measured, this did not settle the question, and Lobachevsky concluded (our translation): “it is very probable that the Euclidean propositions alone are true, although they will remain forever unproved. In any case, the new Geometry, whose foundation is laid here, even if it does not exist in nature, can nevertheless exist in our imagination” <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 247]" aria-label="Citation [Yus68, p. 247]">c</a>.<sup class="fn" id="fnref-2-1"><a href="#fn-2-1" aria-label="Note 1">1</a></sup> Lobachevsky went further and suggested that different forces in nature might follow different geometries. In Euclidean geometry the surface of a sphere of radius $r$ is $4\pi r^2$, which is why an attractive force spreading over that surface weakens with the square of the distance; in his geometry the surface is $\pi(e^r - e^{-r})^2$ (where $e$ is not Euler’s number but a constant depending on the unit of length), and “molecular forces” might obey such a geometry, so that its effects would appear either “beyond the visible world or in the narrow sphere of molecular attractions” <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 248]" aria-label="Citation [Yus68, p. 248]">c</a>.</p>

<p><b class="para-head">Consistency.</b> Lobachevsky took the link between his trigonometric formulas and those of spherical trigonometry as evidence that his geometry is consistent: replacing the sides $a, b, c$ of a spherical triangle by $\frac{a}{i}, \frac{b}{i}, \frac{c}{i}$ turns one system of formulas into the other <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 249]" aria-label="Citation [Yus68, p. 249]">c</a>. As A. P. Norden points out, this argument proves only that the trigonometric formulas are free of contradiction, not that the geometry is <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 250]" aria-label="Citation [Yus68, p. 250]">c</a>. To conclude that the geometry is consistent, every proposition of it would have to follow from these formulas together with absolute geometry; but the spherical formulas, read as formulas of plane trigonometry, contradict the axioms of absolute geometry <a class="cite" href="#bib-KY81" data-cite="[KY81, pp. 65–66]" aria-label="Citation [KY81, pp. 65–66]">c</a>. The idea can be completed with methods unknown in his time: the geometry of the Lobachevsky plane is realised on a sphere of imaginary radius $qi$ in a subspace of complex space, in which the coordinates $x, y$ are real and $z$ is purely imaginary. Such a space was defined much later by H. Poincaré (1906) and H. Minkowski (1908) in connection with the special theory of relativity, and is now called <em>pseudo-Euclidean space</em>; in it, the sphere of radius $qi$ has the form of a two-sheeted hyperboloid, and the Lobachevsky plane is realised on each of its sheets <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 66]" aria-label="Citation [KY81, p. 66]">c</a>. This “sphere of purely imaginary radius” is the “imaginary sphere” that Lambert had suspected (<a class="xref" href="#s2-2-3">Section 2.2.3</a>) <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 67]" aria-label="Citation [KY81, p. 67]">c</a>.</p>

<p><b class="para-head">Reception in his lifetime.</b> The new geometry met with indifference or hostility. In 1834 the journal <i>Syn otechestva</i> ridiculed <i>On the Foundations of Geometry</i>: the reviewers, hiding behind the initials “S. S.”, claimed that Lobachevsky turned white into black and round into square, and appealed to unnamed “first-class mathematicians” who had read the work and understood nothing in it. According to Yushkevich, these were undoubtedly Bunyakovsky and Ostrogradsky <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 252]" aria-label="Citation [Yus68, p. 252]">c</a>. The only public positive assessment came from his Kazan colleague P. I. Kotelnikov, who in a speech of 1842 called Lobachevsky’s work “an astonishing labour” to build a whole science “on a new assumption”, a labour “which sooner or later will find its admirers”. In the same year Gauss, who valued the <i>Geometrische Untersuchungen</i> highly, had Lobachevsky elected a corresponding member of the Göttingen Scientific Society <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 59]" aria-label="Citation [KY81, p. 59]">c</a>, apparently the only recognition he received abroad during his lifetime <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 251]" aria-label="Citation [Yus68, p. 251]">c</a>. From the late 1860s his standing changed completely. W. K. Clifford wrote: “What Copernicus was to Ptolemy, that was Lobachevsky to Euclid” <a class="cite" href="#bib-Yus68" data-cite="[Yus68, p. 262]" aria-label="Citation [Yus68, p. 262]">c</a>.</p>

<h3 id="s2-3-3" data-key="subsec:bolyai"><span class="no">2.3.3</span>János Bolyai (1802–1860)</h3>

<p>János Bolyai, son of the mathematician Farkas Bolyai, graduated from the military engineering academy in Vienna and served as an army officer <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 60]" aria-label="Citation [KY81, p. 60]">c</a>. His father had himself spent years trying to prove the parallel postulate and begged his son to “leave the science of parallels alone” <a class="cite" href="#bib-Gre93" data-cite="[Gre93, pp. 161–162]" aria-label="Citation [Gre93, pp. 161–162]">c</a>. János was not deterred: in 1823 he wrote to his father that “out of nothing I have created a strange new universe” <a class="cite" href="#bib-Gre93" data-cite="[Gre93, p. 163]" aria-label="Citation [Gre93, p. 163]">c</a>. His results appeared in 1832 as an appendix to his father’s textbook; its full title describes it as containing “the absolutely true science of space, independent of the truth or falsity of Euclid’s Axiom XI” <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 61]" aria-label="Citation [KY81, p. 61]">c</a>.<sup class="fn" id="fnref-2-2"><a href="#fn-2-2" aria-label="Note 2">2</a></sup></p>

<p>Like Lobachevsky, who joined his trigonometric formulas to the propositions that do not depend on the parallel postulate <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 66]" aria-label="Citation [KY81, p. 66]">c</a>, Bolyai built on these propositions. What was new in his work was the form of his results: he stated as many of them as he could so that one statement holds whether the postulate is true or false. He called Euclidean geometry “system $\Sigma$” and the new geometry “system $S$”, and called whatever holds in both “absolute”. His law of sines, for example, reads</p>

<div class="math-display">$$\frac{\sin A}{\bigcirc a} = \frac{\sin B}{\bigcirc b}
  = \frac{\sin C}{\bigcirc c},$$</div>

<p>where $\bigcirc r$ is the circumference of a circle of radius $r$ <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 64]" aria-label="Citation [KY81, p. 64]">c</a>; in Euclidean geometry $\bigcirc r = 2\pi r$, and the formula becomes the familiar law of sines. The modern term <em>absolute geometry</em> comes from Bolyai’s but is narrower: it means only the facts that do not depend on the parallel postulate, whereas Bolyai also gave “absolute” formulations to facts that differ in the two geometries <a class="cite" href="#bib-KY81" data-cite="[KY81, p. 65]" aria-label="Citation [KY81, p. 65]">c</a>. Absolute geometry is fundamental to the way this thesis introduces non-Euclidean geometry to students (it is developed in <a class="xref" href="#ch3">Chapter 3</a>).</p>

<div class="authorview">
  <p>Gauss kept silent, Lobachevsky published and argued from experience, and Bolyai stated his results so that they hold in both geometries. Each attitude added something to non-Euclidean geometry. Gauss’s silence reflects caution: careful thought, and awareness of what it costs to challenge accepted views. Lobachevsky’s appeal to experience shows the value of publishing ideas and of tying mathematical concepts to what can be observed, which can lead to wider acceptance. Bolyai’s absolute formulations give one framework for several geometries without choosing between them. In my view, Bolyai’s approach encourages students to look for properties that hold in more than one geometry, and so to understand geometry more deeply and more flexibly.</p>
</div>

    <section class="sb-card">
      <h3>Try this</h3>
      <div class="sb-task">
        <h4>1. The angle sum of a triangle</h4>
        <p>Draw a triangle. What is its angle sum? Make it bigger. What happens?</p>
        <button class="sb-btn" data-scene="triangle">Load a triangle</button>
        <details><summary>What to notice</summary>
          <p>The sum is always less than 180°. The missing part is the <em>defect</em>, and it grows as the triangle grows. Lambert noticed that the defect of a triangle is proportional to its area (<a class="xref" href="#s2-2-3">Section 2.2.3</a>); Lobachevsky's formula is area $= q^2\delta$ (<a class="xref" href="#s2-3-2">Section 2.3.2</a>).</p></details>

        <details><summary>What to notice</summary>

      </div>

        <details><summary>What to notice</summary>
          <p>The two summit angles are equal and acute: Saccheri's hypothesis of the acute angle (H3), the case realised in hyperbolic geometry (<a class="xref" href="#s2-2-2">Section 2.2.2</a>). Make the quadrilateral larger and watch them shrink.</p></details>

function figSaccheri(){
  const U=62, ox0=0.7, oy=2.7;                 // tikz unit → px; origin shifts
  const X=(x)=> (x+ox0)*U, Y=(y)=> (oy-y)*U;
  const W=(7.8+2.4+1.4)*U, H=(oy+1.05)*U;
  const P=(x,y)=>X(x).toFixed(1)+","+Y(y).toFixed(1);
  function arc(cx,cy,r,a0,a1){ let pts=[]; for(let i=0;i<=24;i++){const a=(a0+(a1-a0)*i/24)*Math.PI/180; pts.push(P(cx+r*Math.cos(a),cy+r*Math.sin(a)));} return "M"+pts.join(" L"); }
  function bez(x0,h){ // quadratic Bezier D -> C with control (1.2, 2-h)
    let pts=[]; for(let i=0;i<=32;i++){const t=i/32, x=x0+2.4*t, y=(1-t)*(1-t)*2+2*(1-t)*t*(2-h)+t*t*2; pts.push(P(x,y));} return pts;
  }
  const panels=[{x:0,h:0,name:"(H1) right"},{x:3.9,h:-0.5,name:"(H2) obtuse"},{x:7.8,h:0.5,name:"(H3) acute"}];
  let s='<svg viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" role="img" aria-label="Saccheri quadrilaterals under the hypotheses of the right, obtuse and acute angle">';
  panels.forEach(function(p,i){
    const hl = i===2, col = hl ? "var(--fig-2)" : "var(--fig-1)";
    const top = bez(p.x,p.h);
    s+='<path d="M'+P(p.x,0)+' L'+P(p.x+2.4,0)+' L'+top[top.length-1]+' L'+top.slice().reverse().join(" L")+' Z" fill="'+(hl?"var(--fig-fill)":"none")+'" stroke="none"/>';
    s+='<g fill="none" stroke="'+col+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">';
    s+='<path d="M'+P(p.x,0)+' L'+P(p.x+2.4,0)+'"/><path d="M'+P(p.x,0)+' L'+P(p.x,2)+'"/><path d="M'+P(p.x+2.4,0)+' L'+P(p.x+2.4,2)+'"/>';
    s+='<path d="M'+top.join(" L")+'"/></g>';
    s+='<g fill="none" stroke="'+col+'" stroke-width="1.6">';
    s+='<path d="M'+P(p.x+0.25,0)+' L'+P(p.x+0.25,0.25)+' L'+P(p.x,0.25)+'"/>';
    s+='<path d="M'+P(p.x+2.15,0)+' L'+P(p.x+2.15,0.25)+' L'+P(p.x+2.4,0.25)+'"/>';
    s+='<path d="M'+P(p.x-0.1,1)+' L'+P(p.x+0.1,1)+'"/><path d="M'+P(p.x+2.3,1)+' L'+P(p.x+2.5,1)+'"/>';
    if(p.h===0){
      s+='<path d="M'+P(p.x,1.75)+' L'+P(p.x+0.25,1.75)+' L'+P(p.x+0.25,2)+'"/>';
      s+='<path d="M'+P(p.x+2.4,1.75)+' L'+P(p.x+2.15,1.75)+' L'+P(p.x+2.15,2)+'"/>';
    } else {
      const t=Math.atan2(-p.h,1.2)*180/Math.PI;          // summit tangent at D
      s+='<path d="'+arc(p.x,2,0.3,-90,t)+'"/>';

function frame(x0,x1,y0,y1,U){
  const X=(x)=>((x-x0)*U), Y=(y)=>((y1-y)*U);
  return {X:X,Y:Y,W:(x1-x0)*U,H:(y1-y0)*U,P:(x,y)=>X(x).toFixed(1)+","+Y(y).toFixed(1),
    arc:function(cx,cy,r,a0,a1,n){ n=n||48; let pts=[]; for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180; pts.push(X(cx+r*Math.cos(a)).toFixed(1)+","+Y(cy+r*Math.sin(a)).toFixed(1));} return pts; }};
}
function dot(F,x,y,r,hollow){ return '<circle cx="'+F.X(x).toFixed(1)+'" cy="'+F.Y(y).toFixed(1)+'" r="'+r+'" fill="'+(hollow?'var(--sheet)':'var(--fig-1)')+'" stroke="var(--fig-1)" stroke-width="1.6"/>'; }
function lbl(F,x,y,t,o){ o=o||{}; return '<text x="'+(F.X(x)+(o.dx||0)).toFixed(1)+'" y="'+(F.Y(y)+(o.dy||0)).toFixed(1)+'" font-size="'+(o.size||24)+'" font-style="'+(o.it===false?'normal':'italic')+'" text-anchor="'+(o.anchor||'middle')+'" fill="var(--fig-1)">'+t+'</text>'; }
function seg(F,a,b,o){ o=o||{}; return '<path d="M'+F.P(a[0],a[1])+' L'+F.P(b[0],b[1])+'" stroke="'+(o.col||'var(--fig-1)')+'" stroke-width="'+(o.w||2.6)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+' fill="none" stroke-linecap="round"/>'; }

/* Sphere x²+y²+z²=r², same view and scale as figHyperboloid, for the "r → qi" pair. */
function figSphere(){
  const U=95, r=1.3, A=30*Math.PI/180, E=18*Math.PI/180;
  const cA=Math.cos(A), sA=Math.sin(A), cE=Math.cos(E), sE=Math.sin(E);
  const F=frame(-2.35,2.35,-1.5,2.3,U);
  const pr=(x,y,w)=>{ const yy=x*sA+y*cA; return [x*cA-y*sA, w*cE+yy*sE]; };
  const pt=(x,y,w)=>{ const p=pr(x,y,w); return F.P(p[0],p[1]); };
  const t0=Math.atan2(-cA,-sA);
  const ell=(t1,t2)=>{ let a=[]; for(let i=0;i<=48;i++){const t=t1+(t2-t1)*i/48; a.push(pt(r*Math.cos(t),r*Math.sin(t),0));} return a; };
  const line=(pts,o)=>'<path d="M'+pts.join(" L")+'" fill="none" stroke="'+(o.col||'var(--fig-2)')+'" stroke-width="'+(o.w||4.4)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+' stroke-linecap="round" stroke-linejoin="round"/>';
  const ax=(a,b,t,o)=>{ s+=line([pt(a[0],a[1],a[2]),pt(b[0],b[1],b[2])],{col:'var(--fig-1)',w:2.8}); if(t){ const q=pr(b[0],b[1],b[2]); s+=lbl(F,q[0],q[1],t,o); } };
  let s='<svg viewBox="0 0 '+F.W.toFixed(0)+' '+F.H.toFixed(0)+'" role="img" aria-label="A sphere of radius r">';
  s+='<circle cx="'+F.X(0).toFixed(1)+'" cy="'+F.Y(0).toFixed(1)+'" r="'+(r*U).toFixed(1)+'" fill="var(--fig-fill)" stroke="var(--fig-2)" stroke-width="4.4"/>';
  s+=line(ell(t0+Math.PI/2,t0+3*Math.PI/2),{w:2.4,dash:'8 9'});      // back of the equator
  s+=line(ell(t0-Math.PI/2,t0+Math.PI/2),{w:2.8});                   // front of the equator
  ax([r,0,0],[2.1,0,0],'x',{dx:-6,dy:42,size:40}); ax([0,r,0],[0,2.0,0],'y',{dx:-22,dy:-6,size:40});
  ax([0,0,r],[0,0,2.15],'z',{dx:26,dy:14,size:40});
  [1,-1].forEach(function(sg){ s+=dot(F,0,sg*r*cE,7); s+=lbl(F,0,sg*r*cE,sg>0?'r':'−r',{dx:22,dy:sg>0?40:-12,size:40,anchor:'start'}); });
  return s+'</svg>';
}

/* Two-sheeted hyperboloid x²+y²−w²=−1 (q = 1, z = iw), orthographic view from slightly above. */
function figHyperboloid(){
  const U=95, R=1.45, Wr=Math.sqrt(1+R*R), A=30*Math.PI/180, E=18*Math.PI/180;
  const cA=Math.cos(A), sA=Math.sin(A), cE=Math.cos(E), sE=Math.sin(E);
  const F=frame(-2.35,2.35,-2.45,2.55,U);
  const pr=(x,y,w)=>{ const yy=x*sA+y*cA; return [x*cA-y*sA, w*cE+yy*sE]; };
  const pt=(x,y,w)=>{ const p=pr(x,y,w); return F.P(p[0],p[1]); };
  const ell=(w,r,t0,t1)=>{ let a=[]; for(let i=0;i<=48;i++){const t=t0+(t1-t0)*i/48; a.push(pt(r*Math.cos(t),r*Math.sin(t),w));} return a; };
  // front half of a horizontal circle: the points with the smaller depth (screen y offset < 0)
  const t0=Math.atan2(-cA,-sA);              // where the depth term x·sinA + y·cosA is minimal
  const front=(w,r)=>ell(w,r,t0-Math.PI/2,t0+Math.PI/2), back=(w,r)=>ell(w,r,t0+Math.PI/2,t0+3*Math.PI/2);
  // visible outline of a sheet: envelope of its horizontal circles, then the front of the rim
  const outline=(s)=>{ let a=[]; for(let i=0;i<=80;i++){const x=-R+2*R*i/80;
      let r=Math.sqrt((sE*sE+cE*cE*x*x)/(cE*cE-sE*sE)); r=Math.min(Math.max(r,Math.abs(x)),R);
      a.push(F.P(x, s*(cE*Math.sqrt(1+r*r)-sE*Math.sqrt(Math.max(r*r-x*x,0)))));} return a; };
  const line=(pts,o)=>'<path d="M'+pts.join(" L")+'" fill="none" stroke="'+(o.col||'var(--fig-2)')+'" stroke-width="'+(o.w||4.4)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+' stroke-linecap="round" stroke-linejoin="round"/>';
  let s='<svg viewBox="0 0 '+F.W.toFixed(0)+' '+F.H.toFixed(0)+'" role="img" aria-label="The sphere of radius qi in pseudo-Euclidean space: a hyperboloid of two sheets">';
  // asymptotic cone and axes
  [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(function(d){ s+=line([F.P(0,0),F.P(d[0]*1.75,d[1]*1.75*cE)],{col:'var(--fig-3)',w:2.4,dash:'9 10'}); });
  const ax=(x,y,w,t,o)=>{ s+=line([pt(0,0,0),pt(x,y,w)],{col:'var(--fig-1)',w:2.8}); const p=pr(x,y,w); s+=lbl(F,p[0],p[1],t,o); };
  ax(2.1,0,0,'x',{dx:-6,dy:42,size:40}); ax(0,2.0,0,'y',{dx:-22,dy:-6,size:40}); ax(0,0,-1,'',{});
  [1,-1].forEach(function(sg){
    const lower=sg<0, out=outline(sg);
    // upper sheet: the inside of the bowl is seen through the rim; lower sheet: the back of the rim is hidden
    s+='<path d="M'+out.join(" L")+' L'+(lower?front:back)(sg*Wr,R).join(" L")+' Z" fill="var(--fig-fill)" stroke="none"/>';
    if(!lower) s+='<path d="M'+ell(Wr,R,0,2*Math.PI).join(" L")+' Z" fill="var(--fig-fill)" stroke="none"/>';
    const w1=sg*Math.SQRT2;                  // one parallel, r = 1
    s+=line(back(w1,1),{w:2.4,dash:'8 9'}); s+=line(front(w1,1),{w:2.8});
    s+=line(back(sg*Wr,R),lower?{w:2.4,dash:'8 9'}:{});
    s+=line(front(sg*Wr,R),{});
    s+=line(out,{});
    s+=dot(F,0,sg*cE,7);
    s+=lbl(F,0,sg*cE,lower?'−qi':'qi',{dx:22,dy:lower?-12:40,size:40,anchor:'start'});
  });
  ax(0,0,2.45,'z',{dx:26,dy:14,size:40});
  return s+'</svg>';
}

/* Website-only illustrations (not in the thesis PDF), shown in the portrait column beside the paragraph whose text starts with `after`. */
const SITE_FIGS = [
  {after:"Consistency.", who:"Radius <i>r</i> → radius <i>qi</i>",
   draw:function(){ return figSphere()+'<span class="sub-arrow"><i>r</i> → <i>qi</i></span>'+figHyperboloid(); },
   caption:"Above, a sphere of radius <i>r</i>. Below, the sphere of radius <i>qi</i> in pseudo-Euclidean space: a two-sheeted hyperboloid, on each sheet of which the Lobachevsky plane is realised"}
];
function addSiteFigs(root){
  SITE_FIGS.forEach(function(sf){
    const p = Array.prototype.find.call(root.querySelectorAll(".book > p"), function(el){ return el.textContent.trim().indexOf(sf.after)===0; });
    if(!p) return;
    const f = document.createElement("figure");
    f.className="portrait site-fig";      // same place and size as the portraits: right column
    f.innerHTML=sf.draw()+'<figcaption><span class="who">'+sf.who+'</span><span class="credit">'+sf.caption+'. Drawing for this website, not in the thesis PDF</span></figcaption>';
    p.insertAdjacentElement("beforebegin", f);
  });
}

/* Fallback drawings. Figures are normally converted from the thesis TikZ at build time
   (tools/tikz2svg.py); these are used only if that conversion fails for a label. */
const FIGS = {
  "fig:saccheri_quad": figSaccheri
};

/* ---------------- build tabs + panels ---------------- */
const tablist = document.getElementById("tablist");
const main = document.getElementById("main");
const panels = {};

CHAPTERS.forEach(function(ch){
  const b = document.createElement("button");
  b.className="tab"; b.id="tab-"+ch.id; b.setAttribute("role","tab"); b.setAttribute("aria-controls",ch.id);
  b.innerHTML='<span class="num">'+ch.num+'</span><span>'+ch.short+'</span>'+(ch.full||ch.sandbox?'':'<span class="dot" title="'+S.draftTag+'"></span>');
  b.addEventListener("click",function(){ show(ch.id,true); });
  tablist.appendChild(b);

  const sec = document.createElement("section");
  sec.id=ch.id; sec.setAttribute("role","tabpanel"); sec.setAttribute("aria-labelledby","tab-"+ch.id); sec.hidden=true;
  if(ch.sandbox){
    sec.className="chapter";
    sec.innerHTML=document.getElementById("sandbox-tpl").innerHTML;
  } else if(ch.full){
    const tpl = document.getElementById(LANG+"-"+ch.id);
    sec.className="chapter has-toc";
    sec.innerHTML='<nav class="toc" aria-label="'+S.contents+'"><div class="toc-inner"><details open><summary>'+S.contents+'</summary><ol id="toc-'+ch.id+'"></ol></details></div></nav><article class="book">'+tpl.innerHTML+'</article>';
  } else {
    sec.className="chapter";
    const eyebrow = ch.appendix ? S.appendix : S.chapter+" "+ch.num;
    let h='<article class="book"><p class="eyebrow">'+eyebrow+'</p><h2 class="ch-title">'+ch.title+'</h2>';
    h+='<div class="draft-banner"><strong>'+S.draftTag+'</strong><span>'+S.draftMsg+'</span></div>';
    h+='<p class="sample-label">'+S.sampleText+'</p>';
    ch.sample.forEach(function(t){ h+='<p>'+t+'</p>'; });
    h+='<p class="sample-label">'+S.sampleEx+'</p><div class="exercise"><p>'+ch.ex+'</p></div>';
    if(ch.sections.length){
      h+='<p class="sample-label">'+S.planned+'</p><ol class="planned">';
      ch.sections.forEach(function(t){ h+='<li>'+t+'</li>'; });
      h+='</ol>';
    }
    sec.innerHTML=h+'</article>';
  }
  main.appendChild(sec); panels[ch.id]=sec;
});

addPortraits(panels.ch2);
addSiteFigs(panels.ch2);
if(window.Sandbox && panels.sandbox){ try{ window.Sandbox.mount(panels.sandbox); }catch(e){ console.error(e); } }
document.querySelectorAll("[data-fig]").forEach(function(el){
  const f = FIGS[el.getAttribute("data-fig")];
  el.innerHTML = f ? f() : '<p class="fig-pending">This figure is in the thesis PDF; the web version is being drawn.</p>';
  if(el.hasAttribute("data-fig-stale")) el.insertAdjacentHTML("beforeend",'<p class="fig-pending">This figure was changed in the thesis; the web drawing may still show the previous version.</p>');

/* table of contents for chapter 2 */
(function(){
  const ol = document.getElementById("toc-ch2");
  const heads = panels.ch2.querySelectorAll(".book h2.sec, .book h3");
  heads.forEach(function(h){
    const li=document.createElement("li"), a=document.createElement("a");
    a.href="#"+h.id; a.className = h.tagName==="H3" ? "lvl3" : "lvl2";
    a.textContent = h.textContent.replace(/^(\d+(\.\d+)*)/,"$1 ");
    li.appendChild(a); ol.appendChild(li);
  });
  // highlight current section
  const links = ol.querySelectorAll("a");
  if("IntersectionObserver" in window){
    const io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          links.forEach(function(l){ l.classList.toggle("on", l.getAttribute("href")==="#"+e.target.id); });
        }
      });
    },{rootMargin:"-15% 0px -75% 0px"});
    heads.forEach(function(h){ io.observe(h); });
  }
})();

/* math */
function renderMath(){
  if(!window.renderMathInElement) return;
  try{
    renderMathInElement(main,{
      delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],
      output:"mathml", throwOnError:false,
      macros:{"\\DD":"\\mathbb{D}","\\HH":"\\mathbb{H}","\\CC":"\\mathbb{C}","\\RR":"\\mathbb{R}"}
    });
    // Chrome's MathML ignores mathvariant="double-struck": swap in the Unicode letters.
    const BB={D:"\u{1D53B}",H:"\u210D",C:"\u2102",R:"\u211D"};
    main.querySelectorAll('mi[mathvariant="double-struck"]').forEach(function(mi){
      const c=mi.textContent; if(BB[c]){ mi.textContent=BB[c]; mi.setAttribute("mathvariant","normal"); }
    });
  }catch(e){}
}
renderMath();

/* ---------------- routing ---------------- */
function owner(id){
  if(panels[id]) return id;
  const el = document.getElementById(id);
  if(!el) return null;
  const p = el.closest('[role="tabpanel"]');
  return p ? p.id : null;
}
function show(id,fromClick){
  Object.keys(panels).forEach(function(k){
    panels[k].hidden = k!==id;
    document.getElementById("tab-"+k).setAttribute("aria-selected", k===id ? "true":"false");
  });
  const tab=document.getElementById("tab-"+id);
  tab.scrollIntoView({block:"nearest",inline:"nearest"});
  save("tc-tab",id);
  if(fromClick){
    try{ history.replaceState(null,"","#"+id); }catch(e){}
    window.scrollTo({top:0});
  }
}
function go(hash){
  const id = (hash||"").replace(/^#/,"");
  const o = id && owner(id);
  if(!o) return false;
  show(o,false);
  if(id!==o){
    const el=document.getElementById(id);
    requestAnimationFrame(function(){
      el.scrollIntoView({block:"start"});
      if(id.indexOf("bib-")===0){
        const dd = el.nextElementSibling;
        [el,dd].forEach(function(n){ n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash"); });
      }
    });
  } else window.scrollTo({top:0});
  return true;
}
main.addEventListener("click",function(e){
  const a = e.target.closest('a[href^="#"]');
  if(!a) return;
  e.preventDefault();
  const h=a.getAttribute("href");
  if(go(h)){ try{ history.replaceState(null,"",h); }catch(err){} }
});
window.addEventListener("hashchange",function(){ go(location.hash); });

/* corner music player: the Spotify embed loads only when opened */
(function(){
  const btn=document.getElementById("tune-btn"), panel=document.getElementById("tune-panel");
  btn.addEventListener("click",function(){
    const open=panel.hidden;
    if(open && !panel.firstChild){
      const f=document.createElement("iframe");
      f.src="https://open.spotify.com/embed/track/6OuppnhPl5ylgm8uPe5vK4?utm_source=generator&theme=0";
      f.allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"; f.loading="lazy"; f.title="Spotify player";
      panel.appendChild(f);
    }
    panel.hidden=!open; btn.setAttribute("aria-expanded",open?"true":"false");
  });
})();


/* citation popups: hover or tap the small "c" to see the citation; click the citation to open the bibliography */
(function(){
  let pop=null, timer=null;
  function close(){ if(pop){ pop.remove(); pop=null; } }
  function open(a){
    close();
    pop=document.createElement("div"); pop.className="cite-pop"; pop.setAttribute("role","tooltip");
    const link=document.createElement("a"); link.href=a.getAttribute("href"); link.textContent=a.dataset.cite; link.title="Go to bibliography";
    pop.appendChild(link); main.appendChild(pop); pop._for=a;
    const r=a.getBoundingClientRect(), w=pop.offsetWidth, vw=document.documentElement.clientWidth;
    let x=r.left+r.width/2-w/2; x=Math.max(16,Math.min(x,vw-w-16));
    pop.style.left=(x+scrollX)+"px"; pop.style.top=(r.bottom+8+scrollY)+"px";
    pop.addEventListener("mouseenter",function(){ clearTimeout(timer); });
    pop.addEventListener("mouseleave",function(){ timer=setTimeout(close,200); });
  }
  let touch=false;   // ignore the simulated mouse events that follow a tap
  main.addEventListener("pointerdown",function(e){ touch = e.pointerType!=="mouse"; },true);
  main.addEventListener("mouseover",function(e){ if(touch) return; const a=e.target.closest("a.cite"); if(a){ clearTimeout(timer); if(!pop||pop._for!==a) open(a); } });
  main.addEventListener("mouseout",function(e){ if(touch) return; if(e.target.closest("a.cite")) timer=setTimeout(close,250); });
  main.addEventListener("click",function(e){
    const a=e.target.closest("a.cite");
    if(a){ e.preventDefault(); e.stopImmediatePropagation(); if(!(pop&&pop._for===a)) open(a); return; }
    if(pop){ const inside=pop.contains(e.target); setTimeout(close,0); if(!inside) return; }
  },true);
})();


if(!go(location.hash)){
  const last = load("tc-tab");
  show(panels[last] ? last : "ch2", false);
}
})();
